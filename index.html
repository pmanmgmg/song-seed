<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<title>Song Seed</title>
<style>
:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --ink: #23261f;
  --sub: #6b6f64;
  --line: #dedbd2;
  --accent: #2f7d5b;
  --accent-ink: #ffffff;
  --accent-soft: #e2f0e8;
  --chord: #b4472b;
  --bass: #2458a6;
  --bass-soft: #e3ecfa;
  --fT: #2f7d5b;
  --fS: #2458a6;
  --fD: #c0392b;
  --danger: #b3261e;
  --hit: #fff1c2;
  --rec: #d93025;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a17;
    --panel: #20251f;
    --ink: #e9ebe4;
    --sub: #a0a596;
    --line: #353b33;
    --accent: #5cc08f;
    --accent-ink: #0e1a13;
    --accent-soft: #23382c;
    --chord: #ff9b7a;
    --bass: #8db8ff;
    --bass-soft: #1f2b40;
    --fT: #6fd3a0;
    --fS: #8db8ff;
    --fD: #ff8a7a;
    --danger: #ff7a70;
    --hit: #4a4220;
    --rec: #ff6b5e;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; /* 長押しで説明を出すため、iOSのメニューを出さない */
}
button:active { transform: translateY(1px); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
button.on { background: var(--accent-soft); border-color: var(--accent); }
input, select, textarea {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 16px; /* iOSで勝手に拡大しない最小サイズ */
  min-width: 0;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 96px; }

/* 上部バー */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
}
.topbar-in { max-width: 860px; margin: 0 auto; display: flex; gap: 6px; align-items: center; }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; }
.topbar button { padding: 6px 10px; }
#btnUndo, #btnRedo { font-size: 18px; line-height: 1.2; padding: 4px 10px; }
.topbar button { white-space: nowrap; }
@media (max-width: 420px) {
  .topbar-in { gap: 4px; }
  .topbar button { padding: 6px 8px; }
  #btnUndo, #btnRedo { padding: 4px 8px; }
  .status { font-size: 11px; }
}
.status { font-size: 12px; color: var(--sub); white-space: nowrap; }
.spacer { flex: 1; }

/* 曲一覧 */
.list-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
.backup-note { font-size: 13px; color: var(--sub); margin: 0 0 16px; }
.backup-note.warn { color: var(--danger); }
.song-card {
  display: block; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  -webkit-user-select: auto; user-select: auto;
}
.song-card .t { font-weight: 700; font-size: 17px; }
.song-card .m { font-size: 13px; color: var(--sub); }
.empty { color: var(--sub); text-align: center; padding: 40px 0; }

/* 曲情報 */
.song-head { margin: 16px 0 12px; }
.song-head .band { color: var(--sub); font-size: 14px; }
.song-head .title { font-size: 24px; font-weight: 800; line-height: 1.3; word-break: break-word; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); white-space: nowrap; }
.chip.warn { background: var(--hit); }
.meta-form {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.meta-form label { display: flex; flex-direction: column; font-size: 12px; color: var(--sub); gap: 2px; }
.meta-form .wide { grid-column: 1 / -1; }
.meta-form input, .meta-form select { width: 100%; color: var(--ink); }
.stepper { display: flex; gap: 4px; }
.stepper input { text-align: center; }
.stepper button { padding: 6px 10px; }
.tempo-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tempo-tools button { font-size: 14px; padding: 4px 10px; }
.est { font-size: 13px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.est b { color: var(--ink); }
.est button { font-size: 13px; padding: 2px 10px; }
@media (min-width: 640px) { .meta-form { grid-template-columns: repeat(4, minmax(0, 1fr)); } .meta-form label.wide2 { grid-column: span 2; } }

/* 表示切り替えバー */
.dispbar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin: 12px 0 4px; font-size: 14px;
}
.dispbar button { font-size: 14px; padding: 4px 10px; }
.dispbar .lbl { color: var(--sub); font-size: 12px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button + button { margin-left: -1px; }
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.struct { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 0; }
.struct .lbl { font-size: 12px; color: var(--sub); }
.struct .sc {
  display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700;
  padding: 3px 10px 3px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  cursor: pointer; -webkit-user-select: none; user-select: none; position: relative;
}
.viewing .struct .sc { padding-left: 10px; }
.struct .sc small { font-weight: 400; color: var(--sub); }
.struct .hd { color: var(--sub); padding: 2px 6px; cursor: grab; touch-action: none; font-weight: 400; }
.struct .sc.dragging { opacity: .4; }
.struct .sc.drop-b { box-shadow: -3px 0 0 var(--accent); }
.struct .sc.drop-a { box-shadow: 3px 0 0 var(--accent); }
.struct .t-3, .struct .t-6 { border-color: var(--chord); }
.struct .t-0, .struct .t-5, .struct .t-7 { border-style: dashed; }
.legend { font-size: 12px; color: var(--sub); display: flex; gap: 10px; flex-wrap: wrap; margin: 2px 0 0; }

/* セクション */
.sec {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  margin: 14px 0; padding: 12px; box-shadow: var(--shadow);
}
.sec-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sec-head select { flex: 0 0 auto; }
.sec-head input.label { flex: 1 1 120px; font-weight: 700; }
.sec-head .rep { display: flex; align-items: center; gap: 2px; font-size: 14px; color: var(--sub); }
.sec-head .rep input { width: 56px; text-align: center; }
.sec-title { font-weight: 800; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.sec-title .x { color: var(--sub); font-weight: 400; }
.sec-title button { font-size: 13px; padding: 2px 8px; font-weight: 400; }
.sec-tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
.sec-tools button { font-size: 14px; padding: 4px 10px; }
.rec-btn { color: var(--rec); }
.hint { font-size: 12px; color: var(--sub); margin: 0 0 6px; }
textarea.lyrics { width: 100%; min-height: 120px; line-height: 1.7; resize: vertical; }

/* コード表示(歌詞・小節マス共通) */
.cv { display: block; }
.cv .nm { display: block; color: var(--chord); font-weight: 700; }
.cv .nm .alt { color: var(--sub); font-weight: 600; font-size: .82em; margin-left: 2px; }
.cv .dg { display: block; font-size: 11px; font-weight: 700; line-height: 1.3; }
.cv .bs {
  display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.35;
  color: var(--bass); background: var(--bass-soft); border-radius: 4px; padding: 0 4px; margin-top: 1px;
}
.cv .bs.ov { outline: 1px dashed var(--bass); }
.bass-only .cv .bs { font-size: 16px; }
.fT { color: var(--fT); } .fS { color: var(--fS); } .fD { color: var(--fD); } .fX { color: var(--sub); }

/* 歌詞+コード */
.lyr { font-size: 18px; line-height: 1.25; }
.lyr .ln { margin: 0 0 10px; min-height: 2.6em; }
.lyr .seg { display: inline-block; vertical-align: bottom; max-width: 100%; }
.lyr .ch {
  display: block; min-height: 1.25em; white-space: nowrap; padding-right: .45em;
  font-size: 16px;
}
.lyr .ly { display: block; white-space: pre-wrap; word-break: break-all; }
.lyr .c { border-radius: 3px; }
.placing .lyr .c, .placing .lyr .end { cursor: pointer; }
.placing .lyr .c:hover, .placing .lyr .end:hover { background: var(--hit); }
.placing .lyr .ch { cursor: pointer; }
.lyr .end { color: var(--sub); font-size: 14px; padding: 0 4px; }
.lyr .ln.blank { min-height: .8em; }

/* 小節マス */
.bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-left: 2px solid var(--ink); }
.bar { border-right: 2px solid var(--ink); border-bottom: 1px solid var(--line); min-height: 48px; display: flex; align-items: stretch; position: relative; }
.bar .slot {
  flex: 1 1 0; min-width: 0; border: none; border-radius: 0; background: transparent;
  padding: 10px 2px; font-size: 16px; overflow: hidden; text-align: center;
}
.bar .slot .cv .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .slot + .slot { border-left: 1px dashed var(--line); }
.bar .slot.blank { color: var(--sub); }
.bar .split {
  position: absolute; right: 2px; top: 2px; font-size: 11px; padding: 0 5px; line-height: 1.5;
  border-radius: 4px; color: var(--sub);
}
.bar-tools { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.bar-tools button { font-size: 14px; padding: 4px 10px; }

.add-sec { margin: 18px 0; }
.add-sec .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.foot { margin-top: 32px; display: flex; justify-content: flex-end; }

/* 閲覧モード */
.viewing .edit-only { display: none !important; }
body:not(.viewing) .view-only { display: none !important; }
.viewing .sec { border: none; box-shadow: none; background: transparent; padding: 4px 0; margin: 8px 0 14px; }
.viewing .bar .slot { cursor: default; }

/* 下から出るシート(コード選択・録音) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  max-height: 86vh; overflow-y: auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
  display: none; box-shadow: 0 -6px 20px rgba(0,0,0,.15);
}
.sheet.open, .sheet-bg.open { display: block; }
.sheet-in { max-width: 640px; margin: 0 auto; }
.sheet .where { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.sheet .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sheet input.chord-in { flex: 1; font-size: 20px; font-weight: 700; color: var(--chord); }
.sheet .err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin: 4px 0; }
.sheet .conv { font-size: 13px; color: var(--sub); }
.sheet h3 { font-size: 12px; color: var(--sub); margin: 12px 0 4px; font-weight: 600; }
.sheet h4 { font-size: 11px; color: var(--sub); margin: 6px 0 3px; font-weight: 400; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { padding: 4px 10px; font-weight: 700; color: var(--chord); line-height: 1.25; }
.pills button small { display: block; font-size: 10px; font-weight: 600; }
.pills.plain button { color: var(--ink); font-weight: 400; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.grid7 button { padding: 8px 0; font-weight: 700; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; }
.qgrid button { padding: 6px 2px; font-size: 14px; }
.sheet .acts {
  display: flex; gap: 8px; margin-top: 14px;
  position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); /* 長いシートでも決定ボタンを常に見せる */
  background: var(--panel); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
}
.sheet .acts .primary { flex: 1; }
.muted { color: var(--sub); font-size: 13px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--sub); margin-top: 12px; }

/* 録音シート */
.rec-main { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
.rec-go { background: var(--rec); color: #fff; border-color: var(--rec); font-weight: 700; padding: 10px 18px; font-size: 17px; }
.rec-go.stop { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.rec-time { font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 700; }
.rec-state { font-size: 14px; color: var(--sub); }
.rec-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.rec-opts button { font-size: 14px; padding: 4px 10px; }
.beats { display: flex; gap: 6px; flex-wrap: wrap; }
.beats button { width: 46px; padding: 4px 0; line-height: 1.2; }
.beats button small { display: block; font-size: 11px; }
.beats .lv3 { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.beats .lv2 { background: var(--accent-soft); border-color: var(--accent); }
.beats .lv0 { opacity: .45; border-style: dashed; }
.take { border-top: 1px solid var(--line); padding: 8px 0; }
.take .tt { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.take .tt .nm { font-weight: 700; flex: 1 1 100%; }
.take .tt .muted { flex: 1; }
.take audio { width: 100%; height: 36px; margin-top: 4px; }
.take button { font-size: 13px; padding: 2px 8px; }


/* 通し録音 */
.full-link { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }
.full-link button { font-weight: 700; }
.fx-head {
  position: sticky; top: var(--topH, 52px); z-index: 9; background: var(--bg);
  margin: 0 -16px; padding: 4px 16px 8px; border-bottom: 1px solid var(--line);
}
.fx-head.folded .rec-opts, .fx-head.folded .comp-hint { display: none; }
.fx-head .fold { font-size: 13px; padding: 4px 8px; color: var(--sub); white-space: nowrap; }
.fx-head .transport { flex-wrap: nowrap; }
.fx-head .transport .pos { min-width: 0; }
.view-opts .grp { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
@media (max-width: 420px) {
  .fx-head .transport { gap: 5px; }
  .fx-head .transport button { padding: 6px 9px; }
  .fx-head .transport .pos { font-size: 15px; }
  .fx-head .rec-state { display: none; }
  .view-opts input[type=range] { width: 80px; }
}
.transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0 8px; }
.transport .rec-go { padding: 6px 14px; font-size: 16px; }
.transport .pos { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
.transport .pos small { display: block; font-size: 11px; color: var(--sub); font-weight: 400; }
.tl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-top: 8px; -webkit-overflow-scrolling: touch; }
.tl-in { position: relative; min-height: 120px; }
.ruler { position: relative; height: 24px; border-bottom: 1px solid var(--line); cursor: pointer; }
.ruler .rb { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 11px; color: var(--sub); padding-left: 3px; pointer-events: none; }
.mrow { position: relative; height: 26px; border-bottom: 1px solid var(--line); cursor: copy; }
.mrow .mempty { position: sticky; left: 0; display: inline-block; font-size: 11px; color: var(--sub); padding: 5px 8px; pointer-events: none; }
.mk {
  position: absolute; top: 2px; bottom: 2px; border-radius: 5px; font-size: 12px; font-weight: 700; overflow: hidden;
  display: flex; align-items: center; padding: 0 14px 0 6px; white-space: nowrap; cursor: grab; touch-action: none;
  background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); -webkit-user-select: none; user-select: none;
}
.mk .mn { overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.mk .mh { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: rgba(127,127,127,.2); }
.mk.c3, .mk.c6 { background: color-mix(in srgb, var(--chord) 22%, var(--panel)); border-color: var(--chord); }
.mk.c1, .mk.c2, .mk.c4 { background: color-mix(in srgb, var(--bass) 18%, var(--panel)); border-color: var(--bass); }
.mk.c0, .mk.c5, .mk.c7 { border-style: dashed; }
.mk.cc { background: color-mix(in srgb, var(--mc) 30%, var(--panel)); border-color: var(--mc); border-style: solid; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.swatches button { min-width: 36px; height: 30px; padding: 0 6px; border-radius: 6px; font-size: 11px; position: relative;
  background: var(--mc, var(--panel)); border: 2px solid transparent; color: var(--sub); }
.swatches button[data-col=""] { border: 1px dashed var(--line); }
.swatches button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.swatches button.on { outline: 3px solid var(--ink); outline-offset: 1px; }
.trk { border-bottom: 1px solid var(--line); }
.trk.quiet .clip { opacity: .35; }
.trh { position: sticky; left: 0; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; padding: 6px 8px; width: min(100%, calc(100vw - 34px)); background: var(--panel); z-index: 2; }
.trh input[data-ff="tname"] { width: 150px; font-weight: 700; padding: 3px 8px; }
.trh button { font-size: 13px; padding: 3px 8px; }
.trh button.rt { color: var(--rec); border-color: var(--rec); background: transparent; }
.trh .vol { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); }
.trh .vol input { width: 80px; }
.lane { position: relative; height: calc(var(--clipH, 36px) + 26px); border-top: 1px dashed var(--line); }
.lane-h { position: sticky; left: 0; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 8px; z-index: 2; background: color-mix(in srgb, var(--panel) 85%, transparent); border-radius: 0 0 6px 0; }
.lane-h button { font-size: 12px; padding: 1px 8px; }
.lane.empty { height: 34px; }
.clip {
  position: absolute; top: 22px; height: var(--clipH, 36px); border-radius: 6px; overflow: hidden; cursor: grab; touch-action: none;
  background: var(--accent-soft); border: 1px solid var(--line); color: var(--sub); -webkit-user-select: none; user-select: none;
}
.clip.act { border-color: var(--accent); } /* 波形は灰色のまま、鳴る区間だけ .use の緑で示す */
.clip.sel { outline: 2px solid var(--chord); outline-offset: 1px; z-index: 1; }
.clip.miss { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--line) 6px 8px); }
.clip { opacity: .55; }
.clip.act, .clip.sel { opacity: 1; }
.clip .use { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 70%, transparent); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); pointer-events: none; box-sizing: border-box; }
.clip .sweep { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--chord) 40%, transparent); outline: 2px dashed var(--chord); pointer-events: none; z-index: 2; }
.comping .clip { cursor: text; }
.comping .clip .eh { display: none; }
.lane-h .inrange { color: var(--accent); font-size: 11px; }
.comp-hint { margin: 6px 0 0; }
.clip canvas { position: absolute; left: 0; top: 0; height: calc(var(--clipH, 36px) - 2px); pointer-events: none; }
.view-opts { margin-top: 6px; align-items: center; }
.view-opts .lbl { font-size: 12px; color: var(--sub); }
.view-opts input[type=range] { width: 110px; }
.trh select { font-size: 13px; padding: 3px 6px; }
.lane-h .base { font-weight: 700; }
.clip .cn { position: absolute; left: 6px; bottom: 1px; font-size: 10px; color: var(--ink); white-space: nowrap; pointer-events: none; }

/* 吹き出し説明・お知らせ・ダイアログ */
.tip {

  background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.45;

}

}

<script>
'use strict';

/* ---------- 定数 ---------- */
const APP_NAME = 'Song Seed';
const SECTION_TYPES = ['前奏', 'Aメロ', 'Bメロ', 'サビ', 'Cメロ', '間奏', '落ちサビ', '後奏', 'その他'];
const BAR_DEFAULT_TYPES = ['前奏', '間奏', '後奏'];
const MAJOR_KEYS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
const MINOR_KEYS = ['Cm', 'C#m', 'Dm', 'Ebm', 'Em', 'Fm', 'F#m', 'Gm', 'G#m', 'Am', 'Bbm', 'Bm'];
const KEY_OPTIONS = [...MAJOR_KEYS, ...MINOR_KEYS];
const FLAT_KEYS = new Set(['F', 'Bb', 'Eb', 'Ab', 'Db', 'Dm', 'Gm', 'Cm', 'Fm', 'Bbm', 'Ebm']);
const TIME_SIGS = ['4/4', '3/4', '6/8', '2/4', '12/8'];
const TUNINGS = [[0, 'レギュラー'], [-1, '半音下げ'], [-2, '全音下げ'], [-3, '1音半下げ']];
const SCALES = {
  major: ['メジャー(長調)', [0, 2, 4, 5, 7, 9, 11]],
  naturalMinor: ['ナチュラルマイナー', [0, 2, 3, 5, 7, 8, 10]],
  harmonicMinor: ['ハーモニックマイナー', [0, 2, 3, 5, 7, 8, 11]],
  melodicMinor: ['メロディックマイナー', [0, 2, 3, 5, 7, 9, 11]],
  dorian: ['ドリアン', [0, 2, 3, 5, 7, 9, 10]],
  mixolydian: ['ミクソリディアン', [0, 2, 4, 5, 7, 9, 10]],
  lydian: ['リディアン', [0, 2, 4, 6, 7, 9, 11]],
  phrygian: ['フリジアン', [0, 1, 3, 5, 7, 8, 10]],
};
const NATURALS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const BASS_NOTES = ['C', 'C#', 'Db', 'D', 'D#', 'Eb', 'E', 'F', 'F#', 'Gb', 'G', 'G#', 'Ab', 'A', 'A#', 'Bb', 'B'];
const QUALITIES = ['', 'm', '7', 'M7', 'm7', '6', 'm6', 'sus4', '7sus4', 'sus2', 'add9', 'madd9',
                   '9', 'm9', 'M9', 'mM7', 'dim', 'dim7', 'm7(b5)', 'aug', '7(9)', '7(b9)', '7(#9)', '7(13)', '11', '13'];
const NOTE_PC = { C: 0, 'B#': 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, Fb: 4, F: 5, 'E#': 5, 'F#': 6, Gb: 6,
                  G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11, Cb: 11 };
const SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const GUITAR = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'G#', 'A', 'Bb', 'B']; // キー不明のときの読みやすい表記
const ROMAN = ['I', '♭II', 'II', '♭III', 'III', 'IV', '♯IV', 'V', '♭VI', 'VI', '♭VII', 'VII'];
const LS_BACKUP = 'songseed.lastBackup';
const LS_PREFS = 'songseed.prefs';
const LS_TUTORIAL = 'songseed.tutorialDone';

/* ---------- 小物 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const chars = (s) => Array.from(s || '');
const clone = (o) => JSON.parse(JSON.stringify(o));
const mod12 = (n) => ((n % 12) + 12) % 12;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できない環境では諦める */ } }
function fmtDate(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
const fmtSec = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const finePointer = () => window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const tip = (t) => `data-tip="${esc(t)}"`;

/* ---------- 表示設定(端末ごと。曲データには入れない) ---------- */
const prefs = Object.assign({ disp: 'both', degree: false, bass: false, bassOnly: false, tips: true }, (() => {
  try { return JSON.parse(lsGet(LS_PREFS) || '{}'); } catch (e) { return {}; }
})());
const savePrefs = () => lsSet(LS_PREFS, JSON.stringify(prefs));

/* ---------- コード名 ---------- */
// 入力ゆれを揃える:全角→半角、♯♭→#b、先頭を大文字、maj7→M7 など
function normalizeChord(raw) {
  let s = String(raw || '').normalize('NFKC').trim().replace(/\s+/g, '');
  if (!s) return '';
  s = s.replace(/♯/g, '#').replace(/♭/g, 'b');
  if (/^n\.?c\.?$/i.test(s)) return 'N.C.';
  s = s.charAt(0).toUpperCase() + s.slice(1);
  s = s.replace(/^([A-G][#b]?)(?:maj|Maj|MAJ|△)/, '$1M').replace(/^([A-G][#b]?)min/, '$1m');
  s = s.replace(/\/([a-g])/, (m, c) => '/' + c.toUpperCase());
  return s;
}
// ルート・種類・ベース音に分解。読めなければ null
function parseChord(s) {
  if (s === 'N.C.') return { nc: true, root: '', quality: '', bass: '' };
  const m = /^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/.exec(s || '');
  if (!m) return null;
  if (!/^[A-Za-z0-9#b+\-()°ø,.]*$/.test(m[2])) return null;
  return { root: m[1], quality: m[2], bass: m[3] || '' };
}
// 和音の骨格:maj / min / dim / hdim(m7-5) / aug / sus
function qclass(q) {
  if (/^(m7\(b5\)|m7-5|m7b5|ø)/.test(q)) return 'hdim';
  if (/^(dim|°)/.test(q)) return 'dim';
  if (/^(aug|\+)/.test(q)) return 'aug';
  if (/^m(?!aj)/.test(q)) return 'min';
  if (/^(sus|7sus)/.test(q)) return 'sus';
  return 'maj';
}
const isDom = (q) => /^(7|9|11|13)(?!.*M)/.test(q);
function spell(pc, style) { return (style === 'flat' ? FLAT : style === 'sharp' ? SHARP : GUITAR)[mod12(pc)]; }
const keyStyle = (key) => (key ? (FLAT_KEYS.has(key) ? 'flat' : 'sharp') : 'guitar');
// キーに合わせた音名の書き方。♭II・♭VI・♭VII のような「♭のつく度数」はシャープ系のキーでもフラットで書く
// (KEY C の裏コードは C#7 でなく Db7、借用は A# でなく Bb)
function spellerFor(key) {
  const ki = keyInfo(key);
  if (!ki) return (pc) => spell(pc, 'guitar');
  const ks = keyStyle(key);
  return (pc) => spell(pc, ROMAN[mod12(pc - ki.tonic)].startsWith('♭') ? 'flat' : ks);
}
const asSpeller = (style) => (typeof style === 'function' ? style : (pc) => spell(pc, style));
// コードを n 半音ずらす。n=0 のときは書いたままの表記を残す
function transposeChord(chord, n, style) {
  if (!chord || !n) return chord;
  const p = parseChord(chord);
  if (!p || p.nc) return chord;
  const sp = asSpeller(style);
  const r = sp(NOTE_PC[p.root] + n);
  const b = p.bass ? '/' + sp(NOTE_PC[p.bass] + n) : '';
  return r + p.quality + b;
}
function transposeNote(note, n, style) { return note && n ? asSpeller(style)(NOTE_PC[note] + n) : note; }
function keyInfo(key) {
  if (!key) return null;
  const minor = key.endsWith('m');
  return { key, tonic: NOTE_PC[minor ? key.slice(0, -1) : key], minor };
}
function transposeKey(key, n) {
  const k = keyInfo(key);
  if (!k) return key;
  return (k.minor ? MINOR_KEYS : MAJOR_KEYS)[mod12(k.tonic + n)];
}
// ディグリー:キーの主音からの度数 + 種類(例 V7, VIm, ♭VII)
function degreeOf(chord, ki) {
  const p = parseChord(chord);
  if (!p || p.nc || !ki) return '';
  let d = ROMAN[mod12(NOTE_PC[p.root] - ki.tonic)] + p.quality;
  if (p.bass) d += '/' + ROMAN[mod12(NOTE_PC[p.bass] - ki.tonic)];
  return d;
}
// ダイアトニック(キーの音だけでできる和音)の骨格。短調はハーモニックマイナーのVも含める
const DIATONIC = {
  major: { 0: ['maj', 'sus'], 2: ['min'], 4: ['min'], 5: ['maj', 'sus'], 7: ['maj', 'sus'], 9: ['min'], 11: ['dim', 'hdim'] },
  minor: { 0: ['min'], 2: ['dim', 'hdim'], 3: ['maj', 'aug'], 5: ['min'], 7: ['min', 'maj', 'sus'], 8: ['maj'], 10: ['maj', 'sus'], 11: ['dim'] },
};
const FUNC = {
  major: { 0: 'T', 4: 'T', 9: 'T', 2: 'S', 5: 'S', 7: 'D', 11: 'D' },
  minor: { 0: 'T', 3: 'T', 8: 'S', 2: 'S', 5: 'S', 7: 'D', 11: 'D', 10: 'S' },
};
function funcOf(chord, ki) {
  const p = parseChord(chord);
  if (!p || p.nc || !ki) return 'X';
  const iv = mod12(NOTE_PC[p.root] - ki.tonic), mode = ki.minor ? 'minor' : 'major';
  const ok = (DIATONIC[mode][iv] || []).includes(qclass(p.quality));
  if (!ki.minor && iv === 5 && qclass(p.quality) === 'min') return 'S'; // IVm(サブドミナントマイナー)
  return ok ? (FUNC[mode][iv] || 'X') : 'X';
}
const FUNC_NAME = { T: 'トニック', S: 'サブドミナント', D: 'ドミナント', X: 'ノンダイアトニック' };

/* ---------- 曲の中のコードを順番に並べる ---------- */
function chordSeq(song) {
  const out = [];
  song.sections.forEach((sec, si) => {
    if (sec.mode === 'bars') {
      sec.bars.forEach((bar, bi) => bar.forEach((sl, k) => { if (sl.chord) out.push({ chord: sl.chord, o: [si, bi, k] }); }));
    } else {
      sec.lines.forEach((ln, li) => ln.chords.forEach((c) => out.push({ chord: c.chord, o: [si, li, c.pos] })));
    }
  });
  return out;
}
const cmpO = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];

/* ---------- KEY の推定 ---------- */
// 24キーそれぞれに「ダイアトニックに収まるコードの数」を数え、最初と最後のコードが主和音なら加点する
function estimateKey(song) {
  const seq = chordSeq(song).map((x) => parseChord(x.chord)).filter((p) => p && !p.nc);
  if (seq.length < 2) return null;
  const res = KEY_OPTIONS.map((key) => {
    const ki = keyInfo(key), mode = ki.minor ? 'minor' : 'major', tonicQ = ki.minor ? 'min' : 'maj';
    let score = 0;
    seq.forEach((p, i) => {
      const iv = mod12(NOTE_PC[p.root] - ki.tonic), cl = qclass(p.quality);
      if ((DIATONIC[mode][iv] || []).includes(cl)) score += 1;
      if (iv === 0 && cl === tonicQ) {
        score += 0.5;
        if (i === 0) score += 1;
        if (i === seq.length - 1) score += 1.5;
      }
      if (iv === 7 && isDom(p.quality)) score += 0.5;
    });
    return { key, score };
  }).sort((a, b) => b.score - a.score);
  const best = res[0], second = res[1], gap = best.score - second.score;
  const conf = gap >= 1.5 ? '高' : gap >= 0.5 ? '中' : '低';
  return { key: best.key, conf, second: second.key };
}
const effKey = (song) => song.key || (estimateKey(song) || {}).key || '';

/* ---------- スケールのコード ---------- */
const TRIAD_Q = { '4,7': '', '3,7': 'm', '3,6': 'dim', '4,8': 'aug' };
function scaleChords(tonic, ivs, style) {
  return ivs.map((_, i) => {
    const n = [0, 2, 4, 6].map((k) => ivs[(i + k) % 7] + (i + k >= 7 ? 12 : 0));
    const third = n[1] - n[0], fifth = n[2] - n[0], sev = n[3] - n[0];
    const tq = TRIAD_Q[`${third},${fifth}`] ?? '';
    let sq = tq;
    if (tq === '') sq = sev === 11 ? 'M7' : '7';
    else if (tq === 'm') sq = sev === 10 ? 'm7' : 'mM7';
    else if (tq === 'dim') sq = sev === 10 ? 'm7(b5)' : 'dim7';
    const root = spell(tonic + n[0], ROMAN[mod12(n[0])].startsWith('♭') ? 'flat' : style); // フリジアンの♭IIなど
    return { triad: root + tq, seventh: root + sq };
  });
}

/* ---------- 提案 ---------- */
// 直前のコードから「次に来やすいコード」(長調の度数で持つ。短調は平行長調に読み替える)
const NEXT = {
  0: [[5, ''], [7, ''], [9, 'm'], [2, 'm'], [4, 'm']],
  2: [[7, '7'], [7, ''], [5, ''], [4, 'm']],
  4: [[9, 'm'], [5, ''], [2, 'm']],
  5: [[7, ''], [0, ''], [2, 'm'], [4, 'm'], [5, 'm']],
  7: [[0, ''], [9, 'm'], [5, ''], [4, 'm']],
  9: [[5, ''], [2, 'm'], [7, ''], [4, 'm']],
  11: [[4, 'm'], [0, '']],
  start: [[0, ''], [5, ''], [7, ''], [9, 'm']],
};
function suggestions(song, prev, show = (c) => c) {
  const key = effKey(song);
  const ki = keyInfo(key);
  if (!ki) return null;
  const spellK = spellerFor(key);
  const maj = ki.minor ? ki.tonic + 3 : ki.tonic; // 平行長調の主音
  const mk = (ivFromMaj, q) => spellK(maj + ivFromMaj) + q;
  const groups = [];
  const seen = new Set();
  const add = (g, chord, label) => { if (!seen.has(g.title + chord)) { seen.add(g.title + chord); g.items.push({ chord, label }); } };

  const g1 = { title: prev ? `「${show(prev)}」の次に来やすい` : '最初のコード向き', items: [] };
  const pp = prev && parseChord(prev);
  if (pp && !pp.nc && isDom(pp.quality)) { // ドミナント7thは4度上へ解決しやすい
    const target = NOTE_PC[pp.root] + 5, iv = mod12(target - maj);
    const q = [2, 4, 9].includes(iv) ? 'm' : '';
    add(g1, spellK(target) + q, '解決先');
  }
  let rows = NEXT.start;
  if (pp && !pp.nc) {
    const iv = mod12(NOTE_PC[pp.root] - maj);
    rows = NEXT[iv] || NEXT.start;
  }
  rows.forEach(([iv, q]) => { const c = mk(iv, q); add(g1, c, degreeOf(c, ki)); });
  groups.push(g1);

  const g2 = { title: 'ドミナント系(記号つき)', items: [] };
  const v7 = spellK(ki.tonic + 7) + '7';
  add(g2, v7, 'V7 ドミナント');
  const targets = ki.minor ? [[3, ''], [5, 'm'], [8, ''], [10, '']] : [[2, 'm'], [4, 'm'], [5, ''], [7, ''], [9, 'm']];
  targets.forEach(([iv, q]) => {
    const tgt = spellK(ki.tonic + iv) + q;
    add(g2, spellK(ki.tonic + iv + 7) + '7', `V7/${degreeOf(tgt, ki)}`);
  });
  add(g2, spellK(ki.tonic + 1) + '7', 'SubV7 裏コード');
  add(g2, spellK(ki.tonic + 2) + (ki.minor ? 'm7(b5)' : 'm7'), 'IIm7 ツーファイブの頭');
  groups.push(g2);

  const g3 = { title: '借用(同主調から)', items: [] };
  const borrow = ki.minor ? [[5, ''], [7, '7'], [0, '']] : [[10, ''], [8, ''], [5, 'm'], [3, ''], [2, 'm7(b5)']];
  borrow.forEach(([iv, q]) => { const c = spellK(ki.tonic + iv) + q; add(g3, c, degreeOf(c, ki)); });
  groups.push(g3);

  const g4 = { title: '色づけ', items: [] };
  const colors = ki.minor ? [[0, 'm7'], [0, 'madd9'], [7, '7sus4'], [8, 'M7']] : [[0, 'add9'], [0, 'M7'], [5, 'M7'], [7, '7sus4'], [9, 'm7'], [2, 'm7']];
  colors.forEach(([iv, q]) => { const c = spellK(ki.tonic + iv) + q; add(g4, c, degreeOf(c, ki)); });
  groups.push(g4);
  return { key, groups };
}

const emptySlot = () => ({ chord: '', bass: '' });

}

// 読み込んだデータの欠けを埋める(バックアップ読み込み・古い形式・将来の項目追加に備える)
function normalizeSong(s) {

}
const normBass = (b) => (b && NOTE_PC[b] !== undefined ? String(b) : '');
function normalizeSection(x) {
  const type = SECTION_TYPES.includes(x.type) ? x.type : 'その他';
  const lines = Array.isArray(x.lines) && x.lines.length ? x.lines.map((l) => ({
    text: String(l.text || ''),
    chords: Array.isArray(l.chords) ? l.chords.filter((c) => c && c.chord).map((c) => ({ pos: clampInt(c.pos, 0, 99999, 0), chord: String(c.chord), bass: normBass(c.bass) })) : [],
  })) : newLines();
  // 段階1では小節のコードを文字列で持っていた。{chord, bass} に揃える
  const slot = (v) => (v && typeof v === 'object' ? { chord: String(v.chord || ''), bass: normBass(v.bass) } : { chord: String(v || ''), bass: '' });

// 通し録音の並び(トラック → テイク)。音声そのものは recordings ストアにあり、ここは位置と長さだけ
const num = (v, lo, hi, def) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };
// パートの色('' は種類ごとの自動)
const PART_COLORS = { red: ['赤', '#e05a47'], orange: ['橙', '#e8913a'], yellow: ['黄', '#d4b21f'], green: ['緑', '#3d9a6b'], teal: ['青緑', '#2a9d9d'], blue: ['青', '#3f74c9'], purple: ['紫', '#8b5cc7'], pink: ['桃', '#d95f9a'], gray: ['灰', '#8a8f86'] };
function normComp(list, takes) {
  return Array.isArray(list) ? list.filter((c) => c && takes.some((k) => k.id === c.tk))
    .map((c) => ({ start: num(c.start, 0, 36000, 0), end: num(c.end, 0, 36000, 0), tk: String(c.tk) })).filter((c) => c.end > c.start) : [];
}
function normalizeFull(f) {
  const tracks = f && Array.isArray(f.tracks) ? f.tracks : [];

    // パートの段(小節単位):start は0から数えた小節、len は小節数。secId があれば曲のパート名を使う

      secId: String(m.secId || ''), label: String(m.label || ''), color: PART_COLORS[m.color] ? m.color : '',

    tracks: tracks.filter((t) => t && typeof t === 'object').map((t, i) => {
      const takes = Array.isArray(t.takes) ? t.takes.filter((k) => k && k.id).map((k) => ({
        id: String(k.id), name: String(k.name || 'テイク'), no: clampInt(k.no, 0, 9999, 0),
        offset: num(k.offset, 0, 36000, 0), trimStart: num(k.trimStart, 0, 36000, 0), length: num(k.length, 0.01, 36000, 1),
        fadeIn: num(k.fadeIn, 0, 600, 0), fadeOut: num(k.fadeOut, 0, 600, 0), dur: num(k.dur, 0, 36000, 0),
      })) : [];
      return {
        id: String(t.id || uid()), name: String(t.name || `トラック${i + 1}`), vol: num(t.vol, 0, 1.5, 1),
        mute: !!t.mute, solo: !!t.solo, muteBySolo: !!t.muteBySolo, active: takes.some((k) => k.id === t.active) ? String(t.active) : (takes[takes.length - 1] || {}).id || '', takes,
        // 範囲ごとに使うテイク(曲の秒で持つ)。範囲の外は active のテイクを使う

        saved: Array.isArray(t.saved) ? t.saved.filter((v) => v && typeof v === 'object').map((v, j) => ({
          id: String(v.id || uid()), name: String(v.name || `つなぎ${j + 1}`),
          active: takes.some((k) => k.id === v.active) ? String(v.active) : '', comp: normComp(v.comp, takes),

}
function clampInt(v, lo, hi, def) {
  const n = parseInt(v, 10);

}

/* ---------- 歌詞を書き換えたときのコード位置の追従 ---------- */
// 1行の中:前後の一致部分は位置を保ち、書き換えた範囲にあったコードは書き換え開始位置へ寄せる
function remapLine(oldText, newText, chordsIn) {
  const a = chars(oldText), b = chars(newText);
  let p = 0;
  while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let s = 0;
  while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  const out = [];
  for (const c of chordsIn) {
    let pos;
    if (c.pos < p) pos = c.pos;
    else if (c.pos >= a.length - s) pos = c.pos + (b.length - a.length);
    else pos = p;
    pos = Math.max(0, Math.min(b.length, pos));
    if (!out.some((o) => o.pos === pos)) out.push({ ...c, pos });
  }
  return out.sort((x, y) => x.pos - y.pos);
}
// 書き換えた数行のかたまり:文字単位で対応をとり、コードは「乗っていた文字」の移動先へ運ぶ。
// 文字が消えたときは、その次に残っている文字へ寄せる。改行も1文字として扱うので、行の分割・結合にも追従する
function remapGap(oldLines, newTexts) {
  const a = chars(oldLines.map((l) => l.text).join('\n')), b = chars(newTexts.join('\n'));
  const n = a.length, m = b.length;
  if (n * m > 2000000) { // 極端に長い貼り付けは行ごとの簡易追従で済ませる
    return newTexts.map((t, k) => ({ text: t, chords: oldLines[k] ? remapLine(oldLines[k].text, t, oldLines[k].chords) : [] }));
  }
  const W = m + 1, L = new Int32Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    L[i * W + j] = a[i] === b[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  }
  const map = new Int32Array(n + 1).fill(-1);
  map[n] = m;
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j] && L[i * W + j] === L[(i + 1) * W + j + 1] + 1) { map[i] = j; i++; j++; }
    else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) i++;
    else j++;
  }
  const starts = []; // 新しい各行の先頭位置
  let off = 0;
  for (const t of newTexts) { starts.push(off); off += chars(t).length + 1; }
  const out = newTexts.map((t) => ({ text: t, chords: [] }));
  let base = 0;
  for (const ln of oldLines) {
    for (const c of ln.chords) {
      let k = base + c.pos;
      while (k < n && map[k] < 0) k++;
      const abs = map[k];
      let li = starts.length - 1;
      while (li > 0 && starts[li] > abs) li--;
      const pos = Math.min(abs - starts[li], chars(newTexts[li]).length);
      if (!out[li].chords.some((o) => o.pos === pos)) out[li].chords.push({ ...c, pos });
    }
    base += chars(ln.text).length + 1;
  }
  out.forEach((o) => o.chords.sort((x, y) => x.pos - y.pos));
  return out;
}
// 行単位:同じ文の行を最長共通部分で対応づけ、間に挟まった(書き換えた)行だけ文字単位で追従させる
function remapLines(oldLines, newTexts) {
  const A = oldLines.map((l) => l.text), B = newTexts, n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  }
  const result = [];
  let i = 0, j = 0, gapA = [], gapB = [];
  const flush = () => {
    if (gapB.length) {
      if (gapA.length) result.push(...remapGap(gapA.map((k) => oldLines[k]), gapB.map((k) => B[k])));
      else gapB.forEach((k) => result.push({ text: B[k], chords: [] }));
    }
    gapA = []; gapB = [];
  };
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) {
      flush();
      result.push({ text: B[j], chords: oldLines[i].chords.map((c) => ({ ...c })) });
      i++; j++;
    } else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { gapB.push(j); j++; }
    else { gapA.push(i); i++; }
  }
  flush();
  return result.length ? result : newLines();
}

/* ---------- 保存(IndexedDB) ---------- */
let db = null;
let storageOk = true;
function openDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB なし')); return; }
    const req = indexedDB.open('songseed', 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('songs')) d.createObjectStore('songs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('recordings')) d.createObjectStore('recordings', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const st = t.objectStore(store);
    const r = fn(st);
    t.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const dbAll = () => tx('songs', 'readonly', (st) => st.getAll());
const dbPut = (song) => tx('songs', 'readwrite', (st) => st.put(song));
const dbDel = (id) => tx('songs', 'readwrite', (st) => st.delete(id));
const recAll = () => tx('recordings', 'readonly', (st) => st.getAll());
const recPut = (r) => tx('recordings', 'readwrite', (st) => st.put(r));
const recDel = (id) => tx('recordings', 'readwrite', (st) => st.delete(id));
const recGet = (id) => tx('recordings', 'readonly', (st) => st.get(id));

let saveTimer = null;
let dirty = false;
async function flushSave() {
  clearTimeout(saveTimer);
  if (!dirty || !cur) return;
  dirty = false;
  if (!storageOk) { setStatus('⚠ この端末に保存できません'); return; }
  try {
    await dbPut(clone(cur));
    setStatus('保存済み');
  } catch (e) {
    dirty = true;
    setStatus('⚠ 保存に失敗しました');
    console.error(e);
  }
}
function setStatus(t) { const el = $('saveStatus'); if (el) el.textContent = t; }

/* ---------- 取り消し・やり直し ---------- */
// 変更のたびに「直前の状態」を積む。文字入力は、同じ欄に入力している間を1手にまとめる
const hist = { undo: [], redo: [], base: '', group: null, lastT: 0 };
const snapOf = (s) => JSON.stringify(s, (k, v) => (k === 'updatedAt' ? undefined : v));
function resetHistory() { hist.undo = []; hist.redo = []; hist.base = cur ? snapOf(cur) : ''; hist.group = null; }
function touch(group) {
  if (!cur) return;
  const now = snapOf(cur);
  const t = Date.now();
  if (now !== hist.base) {
    // 同じ欄への入力は1手にまとめる。ただし1.5秒以上手を止めたら区切る
    if (!(group && group === hist.group && t - hist.lastT < 1500)) {
      hist.undo.push(hist.base);
      if (hist.undo.length > 200) hist.undo.shift();
    }
    hist.redo = [];
    hist.base = now;
  }
  hist.group = group || null;
  hist.lastT = t;
  cur.updatedAt = t;
  dirty = true;
  setStatus('保存待ち…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
  updateUndoButtons();
}
function restore(state) {
  const s = JSON.parse(state);
  s.updatedAt = Date.now();
  const i = songs.findIndex((x) => x.id === s.id);
  if (i >= 0) songs[i] = s;
  cur = s;
  hist.base = state; hist.group = null;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 300);
  renderCur();
}
const renderCur = () => (fullView ? renderFull() : renderEditor());
function undo() {
  if (!cur || !hist.undo.length) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  hist.redo.push(hist.base);
  restore(hist.undo.pop());
  showToast('1つ前に戻しました');
}
function redo() {
  if (!cur || !hist.redo.length) return;
  hist.undo.push(hist.base);
  restore(hist.redo.pop());
  showToast('やり直しました');
}
function updateUndoButtons() {
  const u = $('btnUndo'), r = $('btnRedo');
  if (u) u.disabled = !hist.undo.length;
  if (r) r.disabled = !hist.redo.length;
}

function chordView(item, ctx) {
  const chord = item.chord;
  if (!chord) return '';
  const p = parseChord(chord);
  const shape = transposeChord(chord, ctx.shift, ctx.shapeStyle);
  let nm = chord;
  if (ctx.shift) {
    if (prefs.disp === 'shape') nm = esc(shape);
    else if (prefs.disp === 'both') nm = `${esc(shape)}<span class="alt">(${esc(chord)})</span>`;
    else nm = esc(chord);
  } else nm = esc(chord);
  let html = '';
  const bassOnly = prefs.bass && prefs.bassOnly;
  if (!bassOnly) html += `<span class="nm">${nm}</span>`;
  if (prefs.degree && !bassOnly && ctx.ki && p && !p.nc) {
    const f = funcOf(chord, ctx.ki);
    html += `<span class="dg f${f}">${esc(degreeOf(chord, ctx.ki))}</span>`;
  }
  if (prefs.bass && p) {
    const note = p.nc ? '—' : (item.bass || p.bass || p.root);
    html += `<span class="bs ${item.bass ? 'ov' : ''}">${esc(note)}</span>`;
  }
  return `<span class="cv">${html}</span>`;
}

function renderLine(sec, ln, li, ctx) {
  const cs = chars(ln.text);
  const chordAt = new Map(ln.chords.map((c) => [c.pos, c]));
  if (!cs.length && !ln.chords.length) {
    return viewing ? '<div class="ln blank"></div>'
      : `<div class="ln"><span class="seg"><span class="ch"></span><span class="ly"><span class="end" data-act="pick-lyric" data-line="${li}" data-pos="0">＋</span></span></span></div>`;
  }
  // コードの位置で区切り、「コード+そこからの歌詞」を1かたまりにする(コード名が長いと後ろの歌詞を押し出す)
  const cuts = [...new Set([0, ...ln.chords.map((c) => c.pos)])].filter((p) => p <= cs.length).sort((a, b) => a - b);
  let html = '';
  cuts.forEach((start, k) => {
    const end = k + 1 < cuts.length ? cuts[k + 1] : cs.length;
    const item = chordAt.get(start);
    let ly = '';
    for (let p = start; p < end; p++) ly += `<span class="c" data-act="pick-lyric" data-line="${li}" data-pos="${p}">${esc(cs[p])}</span>`;
    const isLast = k === cuts.length - 1;
    if (isLast && !viewing && !chordAt.has(cs.length)) ly += `<span class="end" data-act="pick-lyric" data-line="${li}" data-pos="${cs.length}">＋</span>`;
    html += `<span class="seg"><span class="ch" ${item ? `data-act="pick-lyric" data-line="${li}" data-pos="${start}"` : ''}>${item ? chordView(item, ctx) : ''}</span><span class="ly">${ly || (item ? ' ' : '')}</span></span>`;
  });
  return `<div class="ln">${html}</div>`;
}

/* ---------- 画面遷移 ---------- */
async function route() {
  const m = /song=([^&]+)/.exec(location.hash);
  const song = m && songs.find((s) => s.id === decodeURIComponent(m[1]));
  closeSheets();
  const wantFull = !!song && /[#&]full\b/.test(location.hash);
  if (fullView && !wantFull) leaveFull();
  fullView = wantFull;
  if (song) {
    if (!cur || cur.id !== song.id) { cur = song; resetHistory(); await loadRecCount(); }
    cur = song;
    if (fullView) openFull(); else renderEditor();
  } else {
    stopMetro();
    cur = null; viewing = false; renderList();
  }
  window.scrollTo(0, 0);
}
async function go(hash) {
  await flushSave();
  if (location.hash === hash) route(); else location.hash = hash;
}

/* ---------- 操作 ---------- */
const findSec = (id) => cur && cur.sections.find((x) => x.id === id);
const flash = (msg) => showToast(msg, { label: '元に戻す', fn: undo });

function transposeSong(n) {
  const key = effKey(cur);
  const newKey = key ? transposeKey(key, n) : '';
  const style = spellerFor(newKey);
  const tc = (c) => transposeChord(c, n, style);
  for (const sec of cur.sections) {
    for (const ln of sec.lines) for (const c of ln.chords) { c.chord = tc(c.chord); c.bass = transposeNote(c.bass, n, style); }
    for (const bar of sec.bars) for (const sl of bar) { sl.chord = tc(sl.chord); sl.bass = transposeNote(sl.bass, n, style); }
  }
  if (cur.key) cur.key = newKey;
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled || !$('app').contains(el)) return;
  const act = el.dataset.act;
  const secEl = el.closest('.sec');
  const sec = secEl ? findSec(secEl.dataset.sec) : null;

  switch (act) {
    case 'new-song': {
      const s = newSong();
      songs.push(s); cur = s;
      resetHistory(); recCount = {};
      s.sections.forEach((x) => { lyricMode[x.id] = 'write'; });
      dirty = true; await flushSave();
      go('#song=' + encodeURIComponent(s.id));
      break;
    }
    case 'open-song': go('#song=' + encodeURIComponent(el.dataset.id)); break;
    case 'back': go(''); break;
    case 'help': openTutorial(0); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'toggle-view': viewing = !viewing; renderEditor(); break;
    case 'export': exportBackup(); break;
    case 'import': $('importFile').click(); break;
    case 'del-song': {
      if (!(await askConfirm(`「${cur.title || '無題の曲'}」を削除します。この曲の録音も消え、元に戻せません。`, '削除する'))) return;
      const id = cur.id;
      songs = songs.filter((s) => s.id !== id);
      dirty = false; cur = null;
      try {
        await dbDel(id);
        for (const r of await recAll()) if (r.songId === id) await recDel(r.id);
      } catch (e) { console.error(e); }
      go('');
      break;
    }

  for (let i = 0; i < out.length; i++) { let m = 0; for (let j = i * step, e = Math.min(d.length, j + step); j < e; j++) { const v = Math.abs(d[j]); if (v > m) m = v; } out[i] = m; }

}

async function loadFullBuffers1() {
  const ids = [];
  for (const t of ensureFull(cur).tracks) for (const k of t.takes) if (!fx.bufs.has(k.id) && !fx.missing.has(k.id)) ids.push(k.id);
  if (!ids.length || !storageOk) return false;
  fx.loading = true;
  for (const id of ids) {
    try {
      const r = await recGet(id);
      if (!r || !r.blob) { fx.missing.add(id); continue; }
      const buf = await decodeBlob(r.blob);
      fx.bufs.set(id, buf); fx.peaks.set(id, makePeaks(buf));

}

function drawClips() {
  const pps = fx.pps;
  document.querySelectorAll('.clip').forEach((el) => {
    const { tk } = findTake(el.dataset.tr, el.dataset.tk);
    const cv = el.querySelector('canvas'), pk = tk && fx.peaks.get(tk.id);
    if (!cv || !tk) return;
    const w = Math.max(1, Math.min(16000, Math.round(tk.length * pps)));
    cv.width = w; cv.style.width = w + 'px';
    if (!pk) return;
    const g = cv.getContext('2d'), h = cv.height, mid = h / 2;
    g.fillStyle = getComputedStyle(el).color;
    for (let x = 0; x < w; x++) {
      const a = Math.floor((tk.trimStart + x / pps) * 200), b = Math.max(a + 1, Math.floor((tk.trimStart + (x + 1) / pps) * 200));
      let m = 0; for (let i = a; i < b && i < pk.length; i++) if (pk[i] > m) m = pk[i];
      const y = Math.max(0.5, Math.min(1, m * 1.4) * mid);
      g.fillRect(x, mid - y, 1, y * 2);
    }
  });
}

// トラックを「この時間はこのテイク」という切れ端に分ける。範囲指定(comp)が優先、ほかは「使う」のテイク
function resolveTrack(t) {
  const takes = new Map(t.takes.map((k) => [k.id, k]));

function openTutorial(i) {
  const [title, body] = TUTORIAL[i];
  const last = i === TUTORIAL.length - 1;
  const never = !!lsGet(LS_TUTORIAL);
  const btns = [];
  // 「今後は表示しない」を押したときだけ、起動時に出さなくなる(閉じるだけなら次回も出る)
  btns.push(never ? { label: '起動時にまた表示する', value: 'again' } : { label: '今後は表示しない', value: 'never' });
  btns.push({ label: '閉じる', value: 'close' });
  if (i > 0) btns.push({ label: '← 前へ', value: 'prev' });
  if (!last) btns.push({ label: '次へ →', value: 'next', cls: 'primary' });
  dialog(`<div class="step">${i + 1} / ${TUTORIAL.length}</div><h2>${title}</h2>${body}
    <div class="dots">${TUTORIAL.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>`, btns).then((v) => {
    if (v === 'next' && !last) openTutorial(i + 1);
    else if (v === 'prev') openTutorial(i - 1);
    else if (v === 'never') { lsSet(LS_TUTORIAL, '1'); showToast('次からは起動時に出しません(「？」でいつでも見られます)'); }
    else if (v === 'again') { try { localStorage.removeItem(LS_TUTORIAL); } catch (e) { /* 無視 */ } showToast('次の起動時にも表示します'); }
  });
}

/* ---------- バックアップ ---------- */
function exportBackup() {
  const data = { app: APP_NAME, format: 2, exportedAt: new Date().toISOString(), songs };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const d = new Date();
  const name = `SongSeed_バックアップ_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  lsSet(LS_BACKUP, String(Date.now()));
  if (!cur) renderList();
  showToast(`${name} を書き出しました`);
}
async function importBackup(file) {
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { showMessage('読み込めませんでした(JSONファイルではありません)'); return; }
  const list = Array.isArray(data) ? data : data && Array.isArray(data.songs) ? data.songs : null;
  if (!list) { showMessage('Song Seed のバックアップではないようです'); return; }
  let added = 0, updated = 0, kept = 0;
  for (const raw of list) {
    if (!raw || typeof raw !== 'object') continue;
    const s = normalizeSong(raw);
    const i = songs.findIndex((x) => x.id === s.id);
    if (i < 0) { songs.push(s); added++; }
    else if (s.updatedAt > songs[i].updatedAt) { songs[i] = s; updated++; } // 新しい方を残す
    else { kept++; continue; }
    if (storageOk) { try { await dbPut(clone(s)); } catch (e) { console.error(e); } }
  }
  if (cur) cur = songs.find((x) => x.id === cur.id) || null;
  await showMessage(`読み込みました。\n追加 ${added}曲 / 更新 ${updated}曲 / 手元の方が新しいので据え置き ${kept}曲`);
  route();
}

/* ---------- 起動 ---------- */
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', () => { flushSave(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

(async function start() {
  try {
    db = await openDB();
    songs = (await dbAll()).map(normalizeSong);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    console.error(e);
    storageOk = false;
  }
  await route();
  if (!lsGet(LS_TUTORIAL)) openTutorial(0);
})();
</script>
