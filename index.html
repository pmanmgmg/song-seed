<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<title>Song Seed</title>
<style>
:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --ink: #23261f;
  --sub: #6b6f64;
  --line: #dedbd2;
  --accent: #2f7d5b;
  --accent-ink: #ffffff;
  --accent-soft: #e2f0e8;
  --chord: #b4472b;
  --bass: #2458a6;
  --bass-soft: #e3ecfa;
  --fT: #2f7d5b;
  --fS: #2458a6;
  --fD: #c0392b;
  --danger: #b3261e;
  --hit: #fff1c2;
  --rec: #d93025;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a17;
    --panel: #20251f;
    --ink: #e9ebe4;
    --sub: #a0a596;
    --line: #353b33;
    --accent: #5cc08f;
    --accent-ink: #0e1a13;
    --accent-soft: #23382c;
    --chord: #ff9b7a;
    --bass: #8db8ff;
    --bass-soft: #1f2b40;
    --fT: #6fd3a0;
    --fS: #8db8ff;
    --fD: #ff8a7a;
    --danger: #ff7a70;
    --hit: #4a4220;
    --rec: #ff6b5e;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; /* 長押しで説明を出すため、iOSのメニューを出さない */
}
button:active { transform: translateY(1px); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
button.on { background: var(--accent-soft); border-color: var(--accent); }
input, select, textarea {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 16px; /* iOSで勝手に拡大しない最小サイズ */
  min-width: 0;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 96px; }

/* 上部バー */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
}
.topbar-in { max-width: 860px; margin: 0 auto; display: flex; gap: 6px; align-items: center; }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; }
.topbar button { padding: 6px 10px; }
#btnUndo, #btnRedo { font-size: 18px; line-height: 1.2; padding: 4px 10px; }
.topbar button { white-space: nowrap; }
@media (max-width: 420px) {
  .topbar-in { gap: 4px; }
  .topbar button { padding: 6px 8px; }
  #btnUndo, #btnRedo { padding: 4px 8px; }
  .status { font-size: 11px; }
}
.status { font-size: 12px; color: var(--sub); white-space: nowrap; }
.spacer { flex: 1; }

/* 曲一覧 */
.list-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
.backup-note { font-size: 13px; color: var(--sub); margin: 0 0 16px; }
.backup-note.warn { color: var(--danger); }
.song-card {
  display: block; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
  -webkit-user-select: auto; user-select: auto;
}
.song-card .t { font-weight: 700; font-size: 17px; }
.song-row { display: flex; gap: 6px; align-items: stretch; margin-bottom: 10px; }
.song-row .song-card { margin-bottom: 0; flex: 1; min-width: 0; }
.song-row .song-menu { flex: none; width: 44px; font-size: 20px; padding: 0; border-radius: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin: 4px 0 14px; }
.ftile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 8px; border-radius: 12px; background: transparent; border-color: transparent; }
.ftile:hover { background: var(--panel); border-color: var(--line); }
.ftile .ficon svg { width: 54px; height: 43px; fill: #5aa7e6; }
.ftile .ficon.plus { width: 54px; height: 43px; display: flex; align-items: center; justify-content: center; border: 2px dashed var(--line); border-radius: 8px; color: var(--sub); font-size: 22px; }
.ftile .fn { font-size: 13px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ftile small { font-size: 11px; color: var(--sub); }
.ftile.add .fn { color: var(--sub); font-weight: 400; }
.fhead { display: flex; align-items: center; gap: 6px; margin: 2px 0 10px; }
.fhead .fname { flex: 1; font-weight: 800; font-size: 18px; }
.list-h { font-size: 12px; color: var(--sub); font-weight: 600; margin: 0 0 8px; }
.bk-list { max-height: 40vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.bk-g { margin: 4px 0; } .bk-f { display: block; font-weight: 700; margin: 4px 0; } .bk-s { display: block; margin: 3px 0 3px 18px; }
.bk-a { display: block; margin-top: 10px; }
.fpick { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.fpick button { text-align: left; } .fpick button.on { border-color: var(--accent); background: var(--accent-soft); }
.song-card .m { font-size: 13px; color: var(--sub); }
.empty { color: var(--sub); text-align: center; padding: 40px 0; }

/* 曲情報 */
.song-head { margin: 16px 0 12px; }
.song-head .band { color: var(--sub); font-size: 14px; }
.song-head .title { font-size: 24px; font-weight: 800; line-height: 1.3; word-break: break-word; }
.song-head input.h-band, .song-head input.h-title { display: block; width: 100%; background: transparent; border: 1px dashed transparent; border-radius: 8px; padding: 2px 6px; margin-left: -6px; color: var(--ink); }
.song-head input.h-band { font-size: 14px; color: var(--sub); }
.song-head input.h-title { font-size: 24px; font-weight: 800; line-height: 1.3; }
.song-head input.h-band:hover, .song-head input.h-title:hover { border-color: var(--line); }
.song-head input.h-band:focus, .song-head input.h-title:focus { border-color: var(--accent); background: var(--panel); outline: none; }
.song-head .est { margin-top: 6px; }
.song-head .h-lbl { display: block; font-size: 11px; color: var(--sub); margin: 4px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); white-space: nowrap; }
.chip.warn { background: var(--hit); }
button.chip { border: 1px solid transparent; color: var(--ink); font: inherit; font-size: 13px; padding: 4px 12px; cursor: pointer; }
button.chip::after { content: ' ▾'; font-size: 10px; color: var(--sub); }
button.chip.open { border-color: var(--accent); }
button.chip.open::after { content: ' ▴'; }
body.viewing button.chip { pointer-events: none; }
body.viewing button.chip::after { content: ''; }
.chip.dim { background: transparent; border: 1px solid var(--line); color: var(--sub); }
.chip-panel { background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; margin: 8px 0 10px; display: flex; flex-direction: column; gap: 10px; }
.chip-panel label { display: flex; flex-direction: column; font-size: 12px; color: var(--sub); gap: 2px; }
.chip-panel select, .chip-panel input { color: var(--ink); }
.chip-panel .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chip-panel .close { align-self: flex-end; font-size: 13px; padding: 3px 12px; }
.dispbar .lbl2 { font-size: 12px; color: var(--sub); width: 100%; margin-bottom: -2px; }
.meta-form {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.meta-form label { display: flex; flex-direction: column; font-size: 12px; color: var(--sub); gap: 2px; }
.meta-form .wide { grid-column: 1 / -1; }
.meta-form input, .meta-form select { width: 100%; color: var(--ink); }
.stepper { display: flex; gap: 4px; }
.stepper input { text-align: center; }
.stepper button { padding: 6px 10px; }
.tempo-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tempo-tools button { font-size: 14px; padding: 4px 10px; }
.est { font-size: 13px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.est b { color: var(--ink); }
.est button { font-size: 13px; padding: 2px 10px; }
@media (min-width: 640px) { .meta-form { grid-template-columns: repeat(4, minmax(0, 1fr)); } .meta-form label.wide2 { grid-column: span 2; } }

/* 表示切り替えバー */
.dispbar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin: 12px 0 4px; font-size: 14px;
}
.dispbar button { font-size: 14px; padding: 4px 10px; }
/* たたむボタンは、どこでも「見出しの左の ▾/▸」にそろえる(見出しごと押せる) */
.foldh { display: inline-flex; align-items: center; gap: 4px; background: transparent; border: none; padding: 2px 4px 2px 0; font-size: 12px; color: var(--sub); font-weight: 600; cursor: pointer; }
.chev { display: inline-block; width: 7px; height: 7px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg); margin: 0 6px 0 3px; transition: transform .15s; flex: none; }
.chev.open { transform: rotate(45deg) translate(-2px, -2px); } /* 開いている=下向きの「く」、たたんでいる=右向きの「く」(再生の▶と見分ける) */
.foldh:hover { color: var(--ink); }
.dispbar .foldh { width: 100%; margin-bottom: -2px; }
.dispbar .brk { flex-basis: 100%; height: 0; }
.dispbar .lbl { color: var(--sub); font-size: 12px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button + button { margin-left: -1px; }
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.struct { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 0; }
.struct .lbl { font-size: 12px; color: var(--sub); }
.struct .sc {
  display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700;
  padding: 3px 10px 3px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  cursor: pointer; -webkit-user-select: none; user-select: none; position: relative;
}
.viewing .struct .sc { padding-left: 10px; }
.struct .sc small { font-weight: 400; color: var(--sub); }
.struct .hd { color: var(--sub); padding: 2px 6px; cursor: grab; touch-action: none; font-weight: 400; }
.struct .sc.dragging { opacity: .4; }
.struct .sc.drop-b { box-shadow: -3px 0 0 var(--accent); }
.struct .sc.drop-a { box-shadow: 3px 0 0 var(--accent); }
.struct .t-3, .struct .t-6 { border-color: var(--chord); }
.struct .t-0, .struct .t-5, .struct .t-7 { border-style: dashed; }
.legend { font-size: 12px; color: var(--sub); display: flex; gap: 10px; flex-wrap: wrap; margin: 2px 0 0; }

/* セクション */
.sec {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  margin: 14px 0; padding: 12px; box-shadow: var(--shadow);
}
.sec-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sec-head select { flex: 0 0 auto; }
.sec-head input.label { flex: 1 1 120px; font-weight: 700; }
.sec-head .rep { display: flex; align-items: center; gap: 2px; font-size: 14px; color: var(--sub); }
.sec-head .rep input { width: 56px; text-align: center; }
.sec-title { font-weight: 800; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.sec-title .x { color: var(--sub); font-weight: 400; }
.sec-title button { font-size: 13px; padding: 2px 8px; font-weight: 400; }
.sec-tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
.sec-tools button { font-size: 14px; padding: 4px 10px; }
.rec-btn { color: var(--ink); }
.rdot { color: var(--rec); }
.hint { font-size: 12px; color: var(--sub); margin: 0 0 6px; }
textarea.lyrics { width: 100%; min-height: 120px; line-height: 1.7; resize: vertical; }

/* コード表示(歌詞・小節マス共通) */
.cv { display: block; }
.cv .dgm { display: inline-block; position: relative; line-height: 0; margin: 1px 0 2px; padding-right: 11px; cursor: pointer; border-radius: 4px; }
.cv .dgm::after { content: '▶'; position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 9px; line-height: 1; color: var(--accent); }
.cv .dgm:hover, .cv .dgm:active { background: var(--accent-soft); }
body:not(.viewing) .cv .nm { cursor: pointer; }
.how { font-size: 12px; color: var(--sub); margin: 2px 0 6px; }
.how b { color: var(--chord); } .how i { font-style: normal; color: var(--accent); }
.dgsvg line { stroke: var(--sub); stroke-width: .7; }
.dgsvg .fb { fill: none; stroke: var(--sub); stroke-width: .7; }
.dgsvg .nut { stroke: var(--ink); stroke-width: 2.2; }
.dgsvg .dot { fill: var(--ink); }
.dgsvg .bar { stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; }
.dgsvg .op { fill: none; stroke: var(--ink); stroke-width: .9; }
.dgsvg .mx, .dgsvg .pos { fill: var(--sub); font-size: 7px; }
.cplay .cv .nm, .cplay.cv .nm { background: var(--chord); color: var(--bg); border-radius: 4px; padding: 0 3px; }
.slot.cplay { outline: 2px solid var(--chord); }
.pk-top { display: flex; gap: 8px; align-items: flex-start; }
.pk-top .where { flex: 1; }
.pk-top .tips-btn { flex: none; font-size: 13px; padding: 4px 10px; border-color: #e0b23a; color: #e0b23a; }
.pills .easy { font-style: normal; color: #e0b23a; font-size: 10px; margin-left: 2px; }
.c5 { width: 100%; max-width: 320px; display: block; margin: 4px auto; }
.c5 .seg5 { fill: color-mix(in srgb, var(--line) 35%, transparent); stroke: var(--panel); stroke-width: 1.5; }
.c5 .seg5.on { fill: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
.c5 .seg5.ton { fill: color-mix(in srgb, var(--accent) 36%, var(--panel)); }
.c5 text { fill: var(--sub); opacity: .55; font-weight: 700; cursor: pointer; }
.c5 text.on { fill: var(--ink); opacity: 1; }
.c5 .mj { font-size: 17px; } .c5 .mn { font-size: 12px; }
.c5 .dg5 { font-size: 9px; fill: var(--sub); opacity: .7; cursor: default; } .c5 .dg5.s { font-size: 8px; } .c5 .dg5.on { fill: var(--accent); opacity: 1; }
.c5 text.sel { fill: var(--chord); opacity: 1; }
.c5 .mid { fill: var(--ink); } .c5 .midt { fill: var(--bg); font-size: 13px; opacity: 1; cursor: default; } .c5 .midt.s { font-size: 8px; }
.c5note { font-size: 13px; } .c5h { font-size: 14px; margin: 10px 0 4px; }
.modal .prog { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 6px 0; }
.modal .prog button { padding: 2px 9px; flex: none; }
.help-pick { display: grid; gap: 10px; margin: 8px 0; }
.help-pick button { text-align: left; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.help-pick b { font-size: 16px; } .help-pick span { font-size: 12px; color: var(--sub); }
.chat { height: 46vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; }
.chat .msg { max-width: 88%; padding: 8px 11px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; line-height: 1.5; align-self: flex-start; }
.chat .msg.me { align-self: flex-end; background: var(--chord); color: var(--bg); }
.chat .chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chat .chips2 button { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.chat-in { display: flex; gap: 6px; margin-top: 8px; } .chat-in input { flex: 1; min-width: 0; }
.modal .prog .ins { font-size: 12px; margin-top: 4px; }
.pk-tabs { display: flex; gap: 4px; overflow-x: auto; margin: 12px -2px 0; padding: 0 2px 8px; border-bottom: 1px solid var(--line); position: sticky; top: -16px; background: var(--panel); z-index: 2; -webkit-overflow-scrolling: touch; }
.pk-tabs button { flex: none; font-size: 13px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.pk-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.pk-panel { padding: 10px 0 4px; min-height: 120px; }
.pk-panel[hidden] { display: none; }
.pk-panel h4:first-child { margin-top: 0; }
.pane-note { font-size: 12px; color: var(--sub); margin: 0 0 6px; }
.pk-cand h3 { margin-top: 8px; }
.pk-len { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
.pk-len .seg button { padding: 4px 9px; font-size: 13px; }
.pk-dgm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.pk-dgm .dgsvg { width: 86px; height: 58px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.pk-dgm .dgsvg.on { border-color: var(--accent); }
.fbx { overflow-x: auto; margin-top: 6px; }
.fbx table { border-collapse: collapse; font-size: 11px; }
.fbx td { padding: 0; text-align: center; }
.fbx th { font-weight: 400; color: var(--sub); padding: 0 4px 0 0; white-space: nowrap; text-align: right; }
.fbx thead td { color: var(--sub); height: 16px; }
.fbx button { width: 26px; height: 26px; padding: 0; border-radius: 0; border-width: 0 1px 0 0; border-color: var(--line); background: transparent; position: relative; font-size: 11px; color: var(--sub); }
.fbx button::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--sub); opacity: .6; }
.fbx button.m::before, .fbx button.o::before { display: none; }
.fbx button.o { border-right: 3px solid var(--ink); }
.fbx button.on::after { content: ''; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--chord); }
.fbx button.m.on, .fbx button.o.on { color: var(--chord); font-weight: 700; }
.fbx button.m.on::after, .fbx button.o.on::after { display: none; }
.fb-res { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.cv .nm { display: block; color: var(--chord); font-weight: 700; }
body:not(.viewing) .cv .nm { display: inline-block; padding: 1px 7px; border: 1px solid color-mix(in srgb, var(--chord) 55%, transparent); border-radius: 7px; background: color-mix(in srgb, var(--chord) 12%, transparent); line-height: 1.35; }
body:not(.viewing) .cv .nm:hover { background: color-mix(in srgb, var(--chord) 24%, transparent); }
.cv .len { display: inline-block; font-size: 10px; color: var(--sub); margin-left: 3px; font-weight: 400; }
.cv .nm .alt { color: var(--sub); font-weight: 600; font-size: .82em; margin-left: 2px; }
.cv .dg { display: block; font-size: 11px; font-weight: 700; line-height: 1.3; }
.cv .bs {
  display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.35;
  color: var(--bass); background: var(--bass-soft); border-radius: 4px; padding: 0 4px; margin-top: 1px;
}
.cv .bs.ov { outline: 1px dashed var(--bass); }
.bass-only .cv .bs { font-size: 16px; }
.fT { color: var(--fT); } .fS { color: var(--fS); } .fD { color: var(--fD); } .fX { color: var(--sub); }

/* 歌詞+コード */
.lyr { font-size: 18px; line-height: 1.25; }
.lyr .ln { margin: 0 0 10px; min-height: 2.6em; }
.lyr .seg { display: inline-block; vertical-align: bottom; max-width: 100%; }
.lyr .ch {
  display: block; min-height: 1.25em; white-space: nowrap; padding-right: .45em;
  font-size: 16px;
}
.lyr .ly { display: block; white-space: pre-wrap; word-break: break-all; }
.lyr .c { border-radius: 3px; }
.placing .lyr .c, .placing .lyr .end { cursor: pointer; }
.placing .lyr .c:hover, .placing .lyr .end:hover { background: var(--hit); }
.placing .lyr .ch { cursor: pointer; }
.lyr .end { color: var(--sub); font-size: 14px; padding: 0 4px; }
.lyr .ln.blank { min-height: .8em; }

/* 小節マス */
.bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-left: 2px solid var(--ink); }
.bar { border-right: 2px solid var(--ink); border-bottom: 1px solid var(--line); min-height: 48px; display: flex; align-items: stretch; position: relative; }
.bar .slot {
  flex: 1 1 0; min-width: 0; border: none; border-radius: 0; background: transparent;
  padding: 10px 2px; font-size: 16px; overflow: hidden; text-align: center;
}
.bar .slot .cv .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .slot + .slot { border-left: 1px dashed var(--line); }
.bar .slot.blank { color: var(--sub); }
.bar .split {
  position: absolute; right: 2px; top: 2px; font-size: 11px; padding: 0 5px; line-height: 1.5;
  border-radius: 4px; color: var(--sub);
}
.bar-tools { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.bar-tools button { font-size: 14px; padding: 4px 10px; }

.add-sec { margin: 18px 0; }
.add-sec .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.foot { margin-top: 32px; display: flex; justify-content: flex-end; }

/* 閲覧モード */
.viewing .edit-only { display: none !important; }
body:not(.viewing) .view-only { display: none !important; }
.viewing .sec { border: none; box-shadow: none; background: transparent; padding: 4px 0; margin: 8px 0 14px; }
.viewing .bar .slot { cursor: default; }

/* 下から出るシート(コード選択・録音) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  max-height: 86vh; overflow-y: auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
  display: none; box-shadow: 0 -6px 20px rgba(0,0,0,.15);
}
.sheet.open, .sheet-bg.open { display: block; }
.sheet-in { max-width: 640px; margin: 0 auto; }
.sheet .where { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.sheet .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sheet input.chord-in { flex: 1; font-size: 20px; font-weight: 700; color: var(--chord); }
.sheet .err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin: 4px 0; }
.sheet .conv { font-size: 13px; color: var(--sub); }
.sheet h3 { font-size: 12px; color: var(--sub); margin: 12px 0 4px; font-weight: 600; }
.sheet h4 { font-size: 11px; color: var(--sub); margin: 6px 0 3px; font-weight: 400; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { padding: 4px 10px; font-weight: 700; color: var(--chord); line-height: 1.25; }
.pills button small { display: block; font-size: 10px; font-weight: 600; }
.pills .pl { display: inline-flex; align-items: stretch; }
.pills .pl > button:first-child { border-radius: 8px 0 0 8px; }
.pills .pl .pl-play { border-radius: 0 8px 8px 0; border-left: none; padding: 0 7px; font-size: 11px; color: var(--accent); font-weight: 400; }
.pills .mtab { display: block; line-height: 0; margin-top: 2px; }
.pills .mtab .dgsvg { width: 44px; height: 30px; }
.pills .dgl { display: block; font-size: 15px; color: var(--accent); }
.pills .cn2 { display: block; font-size: 12px; }
.pills.plain button { color: var(--ink); font-weight: 400; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.grid7 button { padding: 8px 0; font-weight: 700; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; }
.qgrid button { padding: 6px 2px; font-size: 14px; }
.sheet .acts {
  display: flex; gap: 8px; margin-top: 14px;
  position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); /* 長いシートでも決定ボタンを常に見せる */
  background: var(--panel); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
}
.sheet .acts .primary { flex: 1; }
.muted { color: var(--sub); font-size: 13px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--sub); margin-top: 12px; }

/* 録音シート */
.rec-main { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
.rec-go { background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 700; padding: 10px 18px; font-size: 17px; }
.rec-go .rdot { color: var(--rec); }
.rec-go.stop { background: var(--rec); border-color: var(--rec); color: #fff; } /* 録音中(カウントイン中)だけ赤地に白字 */
.cin { display: inline-flex; align-items: center; gap: 4px; }
.cin .seg button { padding: 4px 9px; }
.rec-time { font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 700; }
.rec-state { font-size: 14px; color: var(--sub); }
.rec-opts { display: flex; gap: 6px; flex-wrap: wrap; }
.rec-opts button { font-size: 14px; padding: 4px 10px; }
.beats { display: flex; gap: 6px; flex-wrap: wrap; }
.beats button { width: 46px; padding: 4px 0; line-height: 1.2; }
.beats button small { display: block; font-size: 11px; }
.beats .lv3 { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.beats .lv2 { background: var(--accent-soft); border-color: var(--accent); }
.beats .lv0 { opacity: .45; border-style: dashed; }
.take { border-top: 1px solid var(--line); padding: 8px 0; }
.take .tt { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.take .tt .nm { font-weight: 700; flex: 1 1 100%; }
.take .tt .muted { flex: 1; }
.take audio { width: 100%; height: 36px; margin-top: 4px; }
.take button { font-size: 13px; padding: 2px 8px; }


/* 通し録音 */
.full-link { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }
.full-link button { font-weight: 700; }
.fx-head {
  position: sticky; top: var(--topH, 52px); z-index: 9; background: var(--bg);
  margin: 0 -16px; padding: 4px 16px 8px; border-bottom: 1px solid var(--line);
}
.fx-head.folded .rec-opts, .fx-head.folded .comp-hint { display: none; }
.fx-head .fold { font-size: 13px; padding: 4px 8px; color: var(--sub); white-space: nowrap; }
.fx-head .transport { flex-wrap: nowrap; }
.fx-head .transport .pos { min-width: 0; }
.rec-opts .grp { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
@media (max-width: 420px) {
  .fx-head .transport { gap: 5px; }
  .fx-head .transport button { padding: 6px 9px; }
  .fx-head .transport .pos { font-size: 15px; }
  .fx-head .rec-state { display: none; }
  .view-opts input[type=range] { width: 80px; }
}
.transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0 8px; }
.transport .rec-go { padding: 6px 14px; font-size: 16px; }
.transport .pos { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
.transport .pos small { display: block; font-size: 11px; color: var(--sub); font-weight: 400; }
.tl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-top: 8px; -webkit-overflow-scrolling: touch; }
.tl-in { position: relative; min-height: 120px; }
.ruler { position: sticky; top: 0; z-index: 4; background: var(--panel); height: 24px; border-bottom: 1px solid var(--line); cursor: ew-resize; touch-action: none; }
#tl { max-height: max(200px, calc(100dvh - var(--topH, 52px) - var(--headH, 200px) - var(--panH, 0px) - 14px)); overflow: auto; }
#tl .mrow { position: sticky; top: 24px; z-index: 4; background: var(--panel); }
.clip-panel.dock { position: sticky; bottom: 0; z-index: 8; max-height: max(120px, min(42vh, calc(100dvh - var(--topH, 52px) - var(--headH, 200px) - 200px))); overflow-y: auto; box-shadow: 0 -6px 18px rgba(0,0,0,.35); border-color: var(--chord); padding-top: 0; }
/* 見出し(たたむ・×)は欄の中でスクロールしても上に残す。スマホで上の固定部分に隠れて押せなかったため */
.clip-panel.dock .cp-head { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 8px 0 4px; margin: 0; }
/* 上の固定部分(再生・設定・ピン留め)は画面の半分まで。超える分は中でスクロールし、トラックと数値の欄の場所を残す */
.fx-head { max-height: 50dvh; overflow-y: auto; overscroll-behavior: contain; }
.clip-panel.dock.folded { padding: 4px 10px; }
.clip-panel .cp-head { flex-wrap: nowrap; }
.clip-panel .cp-head .muted { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.clip-panel .cp-head .foldh { font-size: 14px; color: var(--ink); white-space: nowrap; flex: none; }
.clip-panel .cp-x { font-size: 18px; padding: 0 10px; flex: none; }
/* テイクの数値の欄は画面の下に固定。上の固定部分とトラックの欄の間でページをスクロールしなくても、帯と数値を同時に見られる */
.gridov { position: absolute; left: 0; top: 0; height: 100%; pointer-events: none; z-index: 1; }
.gridov .gb { stroke: var(--line); stroke-width: 1; }
.gridov .gu { stroke: var(--line); stroke-width: 1; opacity: .5; }
.ruler .rb { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 11px; color: var(--sub); padding-left: 3px; pointer-events: none; }
.mrow { position: relative; height: 26px; border-bottom: 1px solid var(--line); cursor: copy; }
.mrow .mempty { position: sticky; left: 0; display: inline-block; font-size: 11px; color: var(--sub); padding: 5px 8px; pointer-events: none; }
.mk {
  position: absolute; top: 2px; bottom: 2px; border-radius: 5px; font-size: 12px; font-weight: 700; overflow: hidden;
  display: flex; align-items: center; padding: 0 14px 0 6px; white-space: nowrap; cursor: grab; touch-action: none;
  background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); -webkit-user-select: none; user-select: none;
}
.mk .mn { overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.mk .mh { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: rgba(127,127,127,.2); }
.mk.c3, .mk.c6 { background: color-mix(in srgb, var(--chord) 22%, var(--panel)); border-color: var(--chord); }
.mk.c1, .mk.c2, .mk.c4 { background: color-mix(in srgb, var(--bass) 18%, var(--panel)); border-color: var(--bass); }
.mk.c0, .mk.c5, .mk.c7 { border-style: dashed; }
.mk.cc { background: color-mix(in srgb, var(--mc) 30%, var(--panel)); border-color: var(--mc); border-style: solid; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.swatches button { min-width: 36px; height: 30px; padding: 0 6px; border-radius: 6px; font-size: 11px; position: relative;
  background: var(--mc, var(--panel)); border: 2px solid transparent; color: var(--sub); }
.swatches button[data-col=""] { border: 1px dashed var(--line); }
.swatches button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.swatches button.on { outline: 3px solid var(--ink); outline-offset: 1px; }
.trk { border-bottom: 1px solid var(--line); }
.trk.tc .trh { box-shadow: inset 4px 0 0 var(--tc); }
.trk.tc .clip { background: color-mix(in srgb, var(--tc) 28%, var(--panel)); border-color: color-mix(in srgb, var(--tc) 75%, #000); color: color-mix(in srgb, var(--tc) 55%, var(--ink)); }
.trk.tc .clip .use { background: color-mix(in srgb, color-mix(in srgb, var(--tc) 70%, #000) 75%, transparent); border-color: var(--tc); }
.trk.tc .lane.fold .fp { background: color-mix(in srgb, var(--tc) 70%, #000); }
.trk.tc .trh { background: color-mix(in srgb, var(--tc) 14%, var(--panel)); }
.trh .ico { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 30px; padding: 0; }
.trh .ico svg { width: 20px; height: 20px; }
.ico-grid svg { width: 30px; height: 30px; }
.trk.tc .trh .ico { color: color-mix(in srgb, var(--tc) 60%, var(--ink)); border-color: var(--tc); }
.ico-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.ico-grid button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; padding: 8px 2px; }
.ico-grid button.on { border-color: var(--accent); background: var(--accent-soft); }
.trh button.tf { min-width: 30px; }
.trh button.pin.on { background: var(--chord); border-color: var(--chord); color: var(--bg); }
.trh select.tcol { width: auto; }
.lane.fold { height: 22px; cursor: pointer; }
.lane.fold .fp { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; background: color-mix(in srgb, var(--tc, var(--accent)) 70%, transparent); pointer-events: none; }
.tl.pin { margin-top: 6px; max-height: 45vh; overflow-y: auto; }
.tl.pin .pin-lbl { position: sticky; left: 0; display: inline-block; font-size: 11px; color: var(--sub); padding: 2px 8px; }
.trk.quiet .clip { opacity: .35; }
.trh { position: sticky; left: 0; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; padding: 6px 8px; width: min(100%, calc(100vw - 34px)); background: var(--panel); z-index: 2; }
.trh input[data-ff="tname"] { width: 150px; font-weight: 700; padding: 3px 8px; }
.trh button { font-size: 13px; padding: 3px 8px; }
.trh button.rt { color: var(--rec); border-color: var(--rec); background: transparent; }
.trh .vol { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); }
.trh .vol input { width: 80px; }
.lane { position: relative; height: calc(var(--clipH, 36px) + 26px); border-top: 1px dashed var(--line); }
.lane-h { position: sticky; left: 0; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 2px 8px; z-index: 2; background: color-mix(in srgb, var(--panel) 85%, transparent); border-radius: 0 0 6px 0; }
.lane-h button { font-size: 12px; padding: 1px 8px; }
.lane.empty { height: 34px; }
.clip {
  position: absolute; top: 22px; height: var(--clipH, 36px); border-radius: 6px; overflow: hidden; cursor: grab; touch-action: none;
  background: var(--accent-soft); border: 1px solid var(--line); color: var(--sub); -webkit-user-select: none; user-select: none;
}
.clip.act { border-color: var(--accent); } /* 波形は灰色のまま、鳴る区間だけ .use の緑で示す */
.clip.sel { outline: 2px solid var(--chord); outline-offset: 1px; z-index: 1; }
.clip.miss { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--line) 6px 8px); }
.clip { opacity: .55; }
.clip.act, .clip.sel { opacity: 1; }
.clip .use { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 70%, transparent); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); pointer-events: none; box-sizing: border-box; }
.clip .sweep { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--chord) 40%, transparent); outline: 2px dashed var(--chord); pointer-events: none; z-index: 2; }
.comping .clip { cursor: text; }
.comping .clip .eh { display: none; }
.lane-h .inrange { color: var(--accent); font-size: 11px; }
.comp-hint { margin: 6px 0 0; }
.clip canvas { position: absolute; left: 0; top: 0; height: calc(var(--clipH, 36px) - 2px); pointer-events: none; }
.rec-opts { margin-top: 6px; align-items: center; }
.rec-opts .lbl, .cin { font-size: 12px; color: var(--sub); }
.view-opts input[type=range] { width: 110px; }
.trh select { font-size: 13px; padding: 3px 6px; }
.lane-h .base { font-weight: 700; }
.clip .cn { position: absolute; left: 6px; bottom: 1px; font-size: 10px; color: var(--ink); white-space: nowrap; pointer-events: none; }
.clip .eh { position: absolute; top: 0; bottom: 0; width: 12px; cursor: ew-resize; background: rgba(127,127,127,.18); }
.clip .eh.l { left: 0; } .clip .eh.r { right: 0; }
.clip .fi, .clip .fo { position: absolute; top: 0; bottom: 0; pointer-events: none; }
.clip .fi { left: 0; background: linear-gradient(to right, rgba(0,0,0,.25), transparent); }
.clip .fo { right: 0; background: linear-gradient(to left, rgba(0,0,0,.25), transparent); }
.ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--rec); pointer-events: none; z-index: 3; }
.full-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.clip-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; display: grid; gap: 8px; }
.clip-panel .row, .full-set .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.clip-panel button { font-size: 13px; padding: 3px 9px; }
.clip-panel .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.clip-panel .fields label { display: flex; flex-direction: column; font-size: 12px; color: var(--sub); gap: 2px; }
.full-set { margin-top: 18px; }
.full-set h3 { font-size: 13px; color: var(--sub); margin: 0 0 6px; }
/* 吹き出し説明・お知らせ・ダイアログ */
.tip {
  position: fixed; z-index: 60; max-width: 260px; pointer-events: none;
  background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1.45;
  padding: 6px 10px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
  opacity: 0; transition: opacity .12s;
}
.tip.show { opacity: 1; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 55; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 8px 8px 14px;
  display: none; align-items: center; gap: 10px; font-size: 14px; max-width: calc(100vw - 32px);
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
.toast.show { display: flex; }
.toast button { background: transparent; color: var(--bg); border-color: rgba(127,127,127,.6); font-size: 14px; padding: 4px 10px; white-space: nowrap; }
.modal-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); border-radius: 14px; padding: 18px; width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto; }
.modal h2 { font-size: 18px; margin: 0 0 8px; }
.modal p { margin: 0 0 8px; }
.modal ul { margin: 0 0 8px; padding-left: 1.2em; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.modal .acts [data-mi="0"] { margin-right: auto; font-size: 13px; color: var(--sub); }
.modal .dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
.modal .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.modal .dots i.on { background: var(--accent); }
.modal .step { font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<div id="app"></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="コードを選ぶ">
  <div class="sheet-in">
    <div class="pk-top"><div class="where" id="pkWhere"></div><button class="tips-btn" data-pk="circle" data-tip="コード進行の基本(五度圏・ディグリー・定番の進行)">💡 TIPS</button></div>
    <div class="row" id="pkModeRow"></div>
    <div class="row" style="margin-top:6px">
      <input class="chord-in" id="pkInput" type="text" placeholder="例: Am7  C/E  F#m7(b5)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    </div>
    <div class="conv" id="pkConv"></div>
    <div class="err" id="pkErr"></div>
    <div class="pk-len" id="pkLen"></div>
    <div class="pk-dgm" id="pkDgm"></div>
    <div id="pkCandWrap" class="pk-cand"><h3>入力中の候補</h3><div class="pills" id="pkCand"></div></div>
    <div class="pk-tabs" id="pkTabs" role="tablist"></div>
    <div class="pk-panel" data-pane="used" id="pkUsedWrap"><div class="pills" id="pkUsed"></div></div>
    <div class="pk-panel" data-pane="deg" id="pkDegWrap"><p class="pane-note" id="pkDegTitle"></p><div id="pkDeg"></div></div>
    <div class="pk-panel" data-pane="c5"><div id="pkC5"></div></div>
    <div class="pk-panel" data-pane="sug" id="pkSugWrap"><div id="pkSug"></div></div>
    <div class="pk-panel" data-pane="scale" id="pkScaleWrap"><p class="pane-note" id="pkScaleTitle"></p><div id="pkScale"></div></div>
    <div class="pk-panel" data-pane="fb" id="pkFbWrap"><div id="pkFb"></div></div>
    <div class="pk-panel" data-pane="build" id="pkBuild">
      <h3>ルート</h3>
      <div class="grid7" id="pkRoot"></div>
      <div class="pills plain" id="pkAcc" style="margin-top:4px"></div>
      <h3>種類</h3>
      <div class="qgrid" id="pkQual"></div>
      <h3>分数コードの低音(C/E の E)</h3>
      <div class="row"><select id="pkSlash"></select><span class="muted">コード名の一部になります</span></div>
    </div>
    <h3>ベース欄の音</h3>
    <div class="row"><select id="pkBassOv"></select><span class="muted">ふだんは自動のまま。ベースに別の音を弾いてほしい所だけ変えます(実音)</span></div>
    <div class="acts">
      <button class="danger" id="pkDel">削除</button>
      <button id="pkCancel">やめる</button>
      <button class="primary" id="pkOk">決定</button>
    </div>

/* ---------- コード名 ---------- */
// 入力ゆれを揃える:全角→半角、♯♭→#b、先頭を大文字、maj7→M7 など

// 直前のコードから「次に来やすいコード」(長調の度数で持つ。短調は平行長調に読み替える)
const NEXT = {

  2: [[7, '7'], [7, ''], [5, ''], [4, 'm']],
  4: [[9, 'm'], [5, ''], [2, 'm']],
  5: [[7, ''], [0, ''], [2, 'm'], [4, 'm'], [5, 'm']],
  7: [[0, ''], [9, 'm'], [5, ''], [4, 'm']],
  9: [[5, ''], [2, 'm'], [7, ''], [4, 'm']],
  11: [[4, 'm'], [0, '']],

function suggestions(song, prev, show = (c) => c) {

  const mk = (ivFromMaj, q) => spellK(maj + ivFromMaj) + q;
  const groups = [];

  const add = (g, chord, label) => { if (!seen.has(g.title + chord)) { seen.add(g.title + chord); g.items.push({ chord, label }); } };

  const g1 = { title: prev ? `「${show(prev)}」の次に来やすい` : '最初のコード向き', items: [] };
  const pp = prev && parseChord(prev);

    rows = NEXT[iv] || NEXT.start;

  const g2 = { title: 'ドミナント系(記号つき)', items: [] };

    key: KEY_OPTIONS.includes(s.key) ? s.key : '',

    capo: clampInt(s.capo, 0, 11, 0),

    folder: String(s.folder || ''),
    sections: Array.isArray(s.sections) ? s.sections.map(normalizeSection) : [],

    chords: Array.isArray(l.chords) ? l.chords.filter((c) => c && c.chord).map((c) => { const o = { pos: clampInt(c.pos, 0, 99999, 0), chord: String(c.chord), bass: normBass(c.bass) }; if (c.beats) o.beats = clampInt(c.beats, 1, 32, 4); return o; }) : [],

        ...(Number(k.gain) > 1 ? { gain: num(k.gain, 1, 16, 1) } : {}), // 音量をそろえた倍率
      })) : [];
      return {

        // 色・楽器の記号(読み込み直したときに落とさない)

    }),

}
function clampInt(v, lo, hi, def) {
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return def;
  return Math.min(hi, Math.max(lo, n));
}

/* ---------- 歌詞を書き換えたときのコード位置の追従 ---------- */
// 1行の中:前後の一致部分は位置を保ち、書き換えた範囲にあったコードは書き換え開始位置へ寄せる
function remapLine(oldText, newText, chordsIn) {
  const a = chars(oldText), b = chars(newText);
  let p = 0;
  while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let s = 0;
  while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  const out = [];
  for (const c of chordsIn) {
    let pos;
    if (c.pos < p) pos = c.pos;
    else if (c.pos >= a.length - s) pos = c.pos + (b.length - a.length);
    else pos = p;
    // 行末より後ろ(行末の「＋」で足したコード)は、行末からの順番を保つ
    const extra = Math.max(0, c.pos - a.length);
    pos = Math.max(0, Math.min(b.length, pos - extra)) + extra;
    if (!out.some((o) => o.pos === pos)) out.push({ ...c, pos });
  }
  return out.sort((x, y) => x.pos - y.pos);
}
// 書き換えた数行のかたまり:文字単位で対応をとり、コードは「乗っていた文字」の移動先へ運ぶ。
// 文字が消えたときは、その次に残っている文字へ寄せる。改行も1文字として扱うので、行の分割・結合にも追従する
function remapGap(oldLines, newTexts) {
  const a = chars(oldLines.map((l) => l.text).join('\n')), b = chars(newTexts.join('\n'));
  const n = a.length, m = b.length;
  if (n * m > 2000000) { // 極端に長い貼り付けは行ごとの簡易追従で済ませる
    return newTexts.map((t, k) => ({ text: t, chords: oldLines[k] ? remapLine(oldLines[k].text, t, oldLines[k].chords) : [] }));
  }
  const W = m + 1, L = new Int32Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    L[i * W + j] = a[i] === b[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  }
  const map = new Int32Array(n + 1).fill(-1);
  map[n] = m;
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j] && L[i * W + j] === L[(i + 1) * W + j + 1] + 1) { map[i] = j; i++; j++; }
    else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) i++;
    else j++;
  }
  const starts = []; // 新しい各行の先頭位置
  let off = 0;
  for (const t of newTexts) { starts.push(off); off += chars(t).length + 1; }
  const out = newTexts.map((t) => ({ text: t, chords: [] }));
  let base = 0;
  for (const ln of oldLines) {
    for (const c of ln.chords) {
      const lineLen = chars(ln.text).length, extra = Math.max(0, c.pos - lineLen); // 行末より後ろのコード
      let k = base + c.pos - extra;
      while (k < n && map[k] < 0) k++;
      const abs = map[k];
      let li = starts.length - 1;
      while (li > 0 && starts[li] > abs) li--;
      const pos = Math.min(abs - starts[li], chars(newTexts[li]).length) + extra;
      if (!out[li].chords.some((o) => o.pos === pos)) out[li].chords.push({ ...c, pos });
    }
    base += chars(ln.text).length + 1;
  }
  out.forEach((o) => o.chords.sort((x, y) => x.pos - y.pos));
  return out;
}
// 行単位:同じ文の行を最長共通部分で対応づけ、間に挟まった(書き換えた)行だけ文字単位で追従させる
function remapLines(oldLines, newTexts) {
  const A = oldLines.map((l) => l.text), B = newTexts, n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  }
  const result = [];
  let i = 0, j = 0, gapA = [], gapB = [];
  const flush = () => {
    if (gapB.length) {
      if (gapA.length) result.push(...remapGap(gapA.map((k) => oldLines[k]), gapB.map((k) => B[k])));
      else gapB.forEach((k) => result.push({ text: B[k], chords: [] }));
    }
    gapA = []; gapB = [];
  };
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) {
      flush();
      result.push({ text: B[j], chords: oldLines[i].chords.map((c) => ({ ...c })) });
      i++; j++;
    } else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { gapB.push(j); j++; }
    else { gapA.push(i); i++; }
  }
  flush();
  return result.length ? result : newLines();
}

/* ---------- 保存(IndexedDB) ---------- */
let db = null;
let storageOk = true;
function openDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB なし')); return; }
    const req = indexedDB.open('songseed', 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('songs')) d.createObjectStore('songs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('recordings')) d.createObjectStore('recordings', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const st = t.objectStore(store);
    const r = fn(st);
    t.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}
const dbAll = () => tx('songs', 'readonly', (st) => st.getAll());
const dbPut = (song) => tx('songs', 'readwrite', (st) => st.put(song));
const dbDel = (id) => tx('songs', 'readwrite', (st) => st.delete(id));
const recAll = () => tx('recordings', 'readonly', (st) => st.getAll());
const recPut = (r) => tx('recordings', 'readwrite', (st) => st.put(r));
const recDel = (id) => tx('recordings', 'readwrite', (st) => st.delete(id));
const recGet = (id) => tx('recordings', 'readonly', (st) => st.get(id));

let saveTimer = null;
let dirty = false;
async function flushSave() {
  clearTimeout(saveTimer);
  if (!dirty || !cur) return;
  dirty = false;
  if (!storageOk) { setStatus('⚠ この端末に保存できません'); return; }
  try {
    await dbPut(clone(cur));
    setStatus('保存済み');
  } catch (e) {
    dirty = true;
    setStatus('⚠ 保存に失敗しました');
    console.error(e);
  }
}
function setStatus(t) { const el = $('saveStatus'); if (el) el.textContent = t; }

/* ---------- 取り消し・やり直し ---------- */
// 変更のたびに「直前の状態」を積む。文字入力は、同じ欄に入力している間を1手にまとめる
const hist = { undo: [], redo: [], base: '', group: null, lastT: 0 };
const snapOf = (s) => JSON.stringify(s, (k, v) => (k === 'updatedAt' ? undefined : v));
function resetHistory() { hist.undo = []; hist.redo = []; hist.base = cur ? snapOf(cur) : ''; hist.group = null; }
function touch(group) {
  if (!cur) return;
  const now = snapOf(cur);
  const t = Date.now();
  if (now !== hist.base) {
    // 同じ欄への入力は1手にまとめる。ただし1.5秒以上手を止めたら区切る
    if (!(group && group === hist.group && t - hist.lastT < 1500)) {
      hist.undo.push(hist.base);
      if (hist.undo.length > 200) hist.undo.shift();
    }
    hist.redo = [];
    hist.base = now;
  }
  hist.group = group || null;
  hist.lastT = t;
  cur.updatedAt = t;
  dirty = true;
  setStatus('保存待ち…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
  updateUndoButtons();
}
function restore(state) {
  const s = JSON.parse(state);
  s.updatedAt = Date.now();
  const i = songs.findIndex((x) => x.id === s.id);
  if (i >= 0) songs[i] = s;
  cur = s;
  hist.base = state; hist.group = null;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 300);
  renderCur();
}
const renderCur = () => (fullView ? renderFull() : renderEditor());
function undo() {
  if (!cur || !hist.undo.length) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  hist.redo.push(hist.base);
  restore(hist.undo.pop());
  showToast('1つ前に戻しました');
}
function redo() {
  if (!cur || !hist.redo.length) return;
  hist.undo.push(hist.base);
  restore(hist.redo.pop());
  showToast('やり直しました');
}
function updateUndoButtons() {
  const u = $('btnUndo'), r = $('btnRedo');
  if (u) u.disabled = !hist.undo.length;
  if (r) r.disabled = !hist.redo.length;
}

  if (!est) return '<span>コードを2つ以上置くと、KEYを推定します</span>';
  if (s.key === est.key) return `<span>コードからの推定とも一致(確度 ${est.conf})</span>`;
  return `<span>コードから推定:<b>${esc(est.key)}</b>(確度 ${est.conf}${est.conf !== '高' ? `/次点 ${esc(est.second)}` : ''})</span>
    <button data-act="use-est" data-k="${esc(est.key)}" ${tip('推定したKEYを曲のKEYに設定します。ディグリーや提案はこのKEYを基準にします')}>このKEYにする</button>`;
}

function chordView(item, ctx) {
  const chord = item.chord;
  if (!chord) return '';
  const p = parseChord(chord);
  const shape = transposeChord(chord, ctx.shift, ctx.shapeStyle);
  let nm = chord;
  if (ctx.shift) {
    if (prefs.disp === 'shape') nm = esc(shape);
    else if (prefs.disp === 'both') nm = `${esc(shape)}<span class="alt">(${esc(chord)})</span>`;
    else nm = esc(chord);
  } else nm = esc(chord);
  let html = '';
  const bassOnly = prefs.bass && prefs.bassOnly;
  if (!bassOnly) html += `<span class="nm">${nm}${item.beats && ctx.bar && item.beats !== ctx.bar ? `<span class="len">${item.beats % ctx.bar === 0 ? item.beats / ctx.bar + '小節' : item.beats + '拍'}</span>` : ''}</span>`;
  if (prefs.degree && !bassOnly && ctx.ki && p && !p.nc) {
    const f = funcOf(chord, ctx.ki);
    html += `<span class="dg f${f}">${esc(degreeOf(chord, ctx.ki))}</span>`;
  }
  if (prefs.dgm !== false && p && !p.nc && !bassOnly) {
    const dc = ctx.shift && prefs.disp !== 'sound' ? shape : chord;
    const svg = diagramSVG(dc, 0);
    if (svg) html += `<span class="dgm" data-act="play-chord" data-c="${esc(chord)}" ${tip('TAB:押すとこのコードの音を鳴らします')}>${svg}</span>`;
  }
  if (prefs.bass && p) {
    let note = p.nc ? '—' : (item.bass || p.bass || p.root);
    // ベースもチューニングを下げているときは、その押さえ方(半音下げなら実音 E♭ → E)で出せる
    if (!p.nc && prefs.bassTuned && ctx.tuning) note = transposeChord(note, -ctx.tuning, ctx.shapeStyle);
    html += `<span class="bs ${item.bass ? 'ov' : ''}">${esc(note)}</span>`;
  }
  return `<span class="cv">${html}</span>`;
}

function renderLine(sec, ln, li, ctx) {
  const cs = chars(ln.text);
  const chordAt = new Map(ln.chords.map((c) => [c.pos, c]));
  if (!cs.length && !ln.chords.length) {
    return viewing ? '<div class="ln blank"></div>'
      : `<div class="ln"><span class="seg"><span class="ch"></span><span class="ly"><span class="end" data-act="pick-lyric" data-line="${li}" data-pos="0">＋</span></span></span></div>`;
  }
  // コードの位置で区切り、「コード+そこからの歌詞」を1かたまりにする(コード名が長いと後ろの歌詞を押し出す)
  const cuts = [...new Set([0, ...ln.chords.map((c) => c.pos)])].sort((a, b) => a - b);
  const endPos = Math.max(cs.length, ...ln.chords.map((c) => c.pos + 1)); // 行末の「＋」はいくつでも足せる
  let html = '';
  cuts.forEach((start, k) => {
    const end = Math.min(k + 1 < cuts.length ? cuts[k + 1] : cs.length, cs.length);
    const item = chordAt.get(start);
    let ly = '';
    for (let p = start; p < end; p++) ly += `<span class="c" data-act="pick-lyric" data-line="${li}" data-pos="${p}">${esc(cs[p])}</span>`;
    const isLast = k === cuts.length - 1;
    if (isLast && !viewing) ly += `<span class="end" data-act="pick-lyric" data-line="${li}" data-pos="${endPos}">＋</span>`;
    html += `<span class="seg"><span class="ch" ${item ? `data-act="pick-lyric" data-line="${li}" data-pos="${start}"` : ''}>${item ? chordView(item, ctx) : ''}</span><span class="ly">${ly || (item ? ' ' : '')}</span></span>`;
  });
  return `<div class="ln">${html}</div>`;
}
function renderBars(sec, ctx) {

      ${bar.map((sl, si) => `<button class="slot ${sl.chord ? '' : 'blank'}" data-act="pick-bar" data-bar="${bi}" data-slot="${si}" aria-label="${bi + 1}小節目">${sl.chord ? chordView(sl, ctx) : (viewing ? '' : '・')}</button>`).join('')}

/* ---------- 画面遷移 ---------- */
async function route() {
  const m = /song=([^&]+)/.exec(location.hash);
  const song = m && songs.find((s) => s.id === decodeURIComponent(m[1]));
  closeSheets();
  const wantFull = !!song && /[#&]full\b/.test(location.hash);
  if (fullView && !wantFull) leaveFull();
  fullView = wantFull;
  if (song) {
    if (!cur || cur.id !== song.id) { cur = song; resetHistory(); await loadRecCount(); }
    cur = song;
    if (fullView) openFull(); else renderEditor();
  } else {
    stopMetro();
    cur = null; viewing = false; renderList();
  }
  window.scrollTo(0, 0);
}
async function go(hash) {
  await flushSave();
  if (location.hash === hash) route(); else location.hash = hash;
}

const findSec = (id) => cur && cur.sections.find((x) => x.id === id);

function transposeSong(n) {
  const key = effKey(cur);
  const newKey = key ? transposeKey(key, n) : '';
  const style = spellerFor(newKey);
  const tc = (c) => transposeChord(c, n, style);
  for (const sec of cur.sections) {
    for (const ln of sec.lines) for (const c of ln.chords) { c.chord = tc(c.chord); c.bass = transposeNote(c.bass, n, style); }
    for (const bar of sec.bars) for (const sl of bar) { sl.chord = tc(sl.chord); sl.bass = transposeNote(sl.bass, n, style); }
  }
  if (cur.key) cur.key = newKey;
}

      if (drag.justDropped) { drag.justDropped = false; return; }

      const item = ln.chords.find((c) => c.pos === pos) || { chord: '', bass: '' };

      break;
    }
  }
});

  const auto = p.nc ? '' : (p.bass ? fromInput(v).split('/')[1] : parseChord(sound).root);

function circleView() {
  const key = effKey(cur), ki = keyInfo(key);
  if (!ki) return null;
  const c = viewCtx(cur), useShape = pick && pick.inputShape && c.shift;
  const sh = useShape ? c.shift : 0, maj = mod12((ki.minor ? ki.tonic + 3 : ki.tonic) + sh);
  const sp = spellerFor(useShape ? transposeKey(key, sh) : key);
  const name = (pc, q) => sp(pc) + q; // 表示(入力の向き)
  const k0 = CIRCLE.indexOf(maj), R = 150, cx = 160, cy = 160;
  const deg = { 0: ['I', 'VIm'], 1: ['V', 'IIIm'], 11: ['IV', 'IIm'] };
  const tonic = mod12(ki.tonic + sh), dOf = (pc, q) => ROMAN[mod12(pc - tonic)] + q; // KEYの主音からの度数(短調ならIm基準)
  let g = '';

    const a0 = ((rel - 0.5) * 30 - 90) * Math.PI / 180, a1 = ((rel + 0.5) * 30 - 90) * Math.PI / 180;
    const on = deg[rel], P = (r, a) => `${cx + r * Math.cos(a)} ${cy + r * Math.sin(a)}`;
    g += `<path d="M${P(R, a0)} A${R} ${R} 0 0 1 ${P(R, a1)} L${P(36, a1)} A36 36 0 0 0 ${P(36, a0)} Z" class="seg5 ${on ? 'on' : ''} ${rel === 0 ? 'ton' : ''}"/>`;
    const am = (rel * 30 - 90) * Math.PI / 180;
    const t = (r, txt, cls, chord) => `<text x="${cx + r * Math.cos(am)}" y="${cy + r * Math.sin(am)}" class="${cls}" data-cc="${esc(chord)}" text-anchor="middle" dominant-baseline="central">${esc(txt)}</text>`;
    const ring = (x) => (i >= 1 && i <= 6 ? SHARP : FLAT)[mod12(x)]; // 五度圏の決まった書き方:右側は♯、左側は♭

    g += t(78, ring(mn) + 'm', `mn ${on ? 'on' : ''}`, on ? name(mn, 'm') : ring(mn) + 'm');
    g += t(141, dOf(pc, ''), `dg5 ${on ? 'on' : ''}`, ''); g += t(57, dOf(mn, 'm'), `dg5 s ${on ? 'on' : ''}`, '');

  return { key, ki, c, useShape, sh, maj, name, keyShown, svg: `<svg class="c5" viewBox="0 0 320 320">${g}</svg>` };
}

// 演奏のみのパートに、選んだ小節から1小節に1つずつ進行を入れる(足りなければ小節を足す)

  if (!pick || pick.target.kind !== 'bar') return;
  const t = pick.target, sec = findSec(t.sec);
  if (!sec) return;
  chords.forEach((ch, k) => {
    const bi = t.bar + k;
    while (sec.bars.length <= bi) sec.bars.push([emptySlot()]);
    sec.bars[bi] = [{ chord: ch, bass: '' }];

  flash(`${t.bar + 1}小節目から ${chords.length}小節にコード進行を入れました`);

  if (m && !m[2].includes('/')) for (const q of QUALITIES) if (q.startsWith(m[2]) && !list.includes(m[1] + q)) list.push(m[1] + q);
  return list.slice(0, 14);
}

function tapTempo() {

  for (let i = 1; i < taps.length; i++) iv.push(taps[i] - taps[i - 1]);
  const bpm = clampInt(Math.round(60000 / (iv.reduce((a, b) => a + b, 0) / iv.length)), 20, 400, cur.tempo);

// トラックを「この時間はこのテイク」という切れ端に分ける。範囲指定(comp)が優先、ほかは「使う」のテイク

  const base = takes.get(t.active);
  const comp = (t.comp || []).filter((c) => takes.has(c.tk));
  const pts = new Set();
  if (base) { pts.add(base.offset); pts.add(base.offset + base.length); }
  for (const c of comp) { pts.add(c.start); pts.add(c.end); const k = takes.get(c.tk); pts.add(k.offset); pts.add(k.offset + k.length); }

    if (!k || m < k.offset || m >= k.offset + k.length) continue; // そのテイクに音がない所は無音
    const last = out[out.length - 1];

function faqAnswer(text) {
  const t = String(text || '').normalize('NFKC').toLowerCase();
  let best = null, bs = 0;
  for (const f of FAQ) {
    const sc = f.k.reduce((a, k) => a + (t.includes(k.toLowerCase()) ? k.length + 1 : 0), 0) + (t.includes(f.q.replace(/[?？]$/, '')) ? 50 : 0);
    if (sc > bs) { bs = sc; best = f; }
  }
  return bs > 0 ? best : null;
}
function openChat() {
  const log = [{ me: false, html: '何でも聞いてください。たとえば下のような質問に答えられます。' }];
  const sugg = ['コードを変える・消すには?', 'コードの音を聞くには?', 'iPhone と Mac の間で曲を移すには?', 'マイクが使えない・録音できない'];

      + `<div class="chips2">${sugg.map((q) => `<button data-cq="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
    box.querySelectorAll('[data-cq]').forEach((b) => b.addEventListener('click', () => ask(b.dataset.cq)));
    box.scrollTop = box.scrollHeight;
  };
  const ask = (q) => {
    q = String(q || '').trim(); if (!q) return;
    log.push({ me: true, html: esc(q) });
    const f = faqAnswer(q);
    if (f) log.push({ me: false, html: `<b>${esc(f.q)}</b><br>${f.a}` });
    else log.push({ me: false, html: 'うまく見つけられませんでした。言い方を変えるか、下から近いものを選んでください。' });
    const others = FAQ.filter((x) => !f || x !== f).map((x) => x.q);
    sugg.splice(0, sugg.length, ...(f ? FAQ.filter((x) => x !== f && x.k.some((k) => f.k.includes(k))).map((x) => x.q).slice(0, 3) : others.slice(0, 6)));
    draw();
  };
  dialog(`<h2>💬 質問する</h2><div class="chat" id="chatLog"></div>
    <div class="chat-in"><input id="chatIn" type="text" placeholder="例:コードを消すには?" autocomplete="off" enterkeyhint="send"><button class="primary" id="chatSend">送る</button></div>
    <p class="muted" style="font-size:11px;margin-top:6px">アプリに入っている答えの中から近いものを返します(通信はしません)。</p>`, [{ label: '操作説明を見る', value: 'tour' }, { label: '閉じる', value: '' }]).then((v) => { if (v === 'tour') openTutorial(0); });
  const inp = $('chatIn');

function openTutorial(i) {
  const [title, body] = TUTORIAL[i];
  const last = i === TUTORIAL.length - 1;
  const never = !!lsGet(LS_TUTORIAL);
  const btns = [];
  // 「今後は表示しない」を押したときだけ、起動時に出さなくなる(閉じるだけなら次回も出る)
  btns.push(never ? { label: '起動時にまた表示する', value: 'again' } : { label: '今後は表示しない', value: 'never' });
  btns.push({ label: '閉じる', value: 'close' });
  if (i > 0) btns.push({ label: '← 前へ', value: 'prev' });
  if (!last) btns.push({ label: '次へ →', value: 'next', cls: 'primary' });
  dialog(`<div class="step">${i + 1} / ${TUTORIAL.length}</div><h2>${title}</h2>${body}
    <div class="dots">${TUTORIAL.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>`, btns).then((v) => {
    if (v === 'next' && !last) openTutorial(i + 1);
    else if (v === 'prev') openTutorial(i - 1);
    else if (v === 'never') { lsSet(LS_TUTORIAL, '1'); showToast('次からは起動時に出しません(「？」でいつでも見られます)'); }
    else if (v === 'again') { try { localStorage.removeItem(LS_TUTORIAL); } catch (e) { /* 無視 */ } showToast('次の起動時にも表示します'); }
  });
}

  const m = $('modal');
  const sync = () => {
    m.querySelectorAll('[data-bs]').forEach((c) => { c.checked = sel.has(c.dataset.bs); });
    m.querySelectorAll('[data-bf]').forEach((c) => { const ids = songs.filter((x) => x.folder === c.dataset.bf).map((x) => x.id); c.checked = ids.every((id) => sel.has(id)); c.indeterminate = !c.checked && ids.some((id) => sel.has(id)); });
    const recs = allRecs.filter((r) => sel.has(r.songId)), mb = recs.reduce((a, r) => a + r.blob.size, 0) * 1.37 / 1048576;
    $('bkInfo').textContent = `${sel.size}曲を書き出します${withAudio ? `(録音 ${recs.length}本・約 ${mb < 1 ? mb.toFixed(1) : Math.round(mb)} MB)` : ''}`;
  };
  m.querySelectorAll('[data-bs]').forEach((c) => c.addEventListener('change', () => { c.checked ? sel.add(c.dataset.bs) : sel.delete(c.dataset.bs); sync(); }));
  m.querySelectorAll('[data-bf]').forEach((c) => c.addEventListener('change', () => { songs.filter((x) => x.folder === c.dataset.bf).forEach((x) => (c.checked ? sel.add(x.id) : sel.delete(x.id))); sync(); }));
  m.querySelectorAll('[data-bx]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.bx === 'all') songs.forEach((x) => sel.add(x.id)); else sel.clear(); sync(); }));
  const ba = m.querySelector('[data-ba]'); if (ba) ba.addEventListener('change', () => { withAudio = ba.checked; sync(); });
  sync();
  if (!(await pr)) return;
  if (!sel.size) { showToast('曲が選ばれていないので書き出しませんでした'); return; }
  const pickSongs = songs.filter((x) => sel.has(x.id)), recs = allRecs.filter((r) => sel.has(r.songId));
  withAudio = withAudio && recs.length > 0;
  const data = { app: APP_NAME, format: 2, exportedAt: new Date().toISOString(), songs: pickSongs, folders: allFolders() };
  if (withAudio) {
    showToast('録音をまとめています…');
    data.recordings = [];
    for (const r of recs) { const { blob, ...meta } = r; data.recordings.push({ ...meta, mime: r.mime || blob.type, data: await blobToB64(blob) }); }
  }
  const blob = new Blob([JSON.stringify(data, null, withAudio ? 0 : 2)], { type: 'application/json' });
  const d = new Date();
  const name = `SongSeed_バックアップ_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}${withAudio ? '_録音つき' : ''}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  lsSet(LS_BACKUP, String(Date.now()));
  if (!cur) renderList();
  showToast(`${name} を書き出しました`);
}
async function importBackup(file) {
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { showMessage('読み込めませんでした(JSONファイルではありません)'); return; }
  const list = Array.isArray(data) ? data : data && Array.isArray(data.songs) ? data.songs : null;
  if (!list) { showMessage('Song Seed のバックアップではないようです'); return; }
  if (data && Array.isArray(data.folders)) saveFolders([...allFolders(), ...data.folders.map(String).filter(Boolean)]);
  let added = 0, updated = 0, kept = 0;
  for (const raw of list) {
    if (!raw || typeof raw !== 'object') continue;
    const s = normalizeSong(raw);
    const i = songs.findIndex((x) => x.id === s.id);
    if (i < 0) { songs.push(s); added++; }
    else if (s.updatedAt > songs[i].updatedAt) { songs[i] = s; updated++; } // 新しい方を残す
    else { kept++; continue; }
    if (storageOk) { try { await dbPut(clone(s)); } catch (e) { console.error(e); } }
  }
  let recAdded = 0;
  if (Array.isArray(data.recordings) && storageOk) {
    for (const r of data.recordings) {
      if (!r || !r.id || !r.data) continue;
      try {
        if (await recGet(r.id)) continue; // 手元にある録音はそのまま
        const { data: b64, ...meta } = r;
        await recPut({ ...meta, blob: b64ToBlob(b64, r.mime || 'audio/mp4') }); recAdded++;
      } catch (e) { console.error(e); }
    }
  }
  if (cur) cur = songs.find((x) => x.id === cur.id) || null;
  const noAudio = !Array.isArray(data.recordings) && list.some((x) => x && x.full && Array.isArray(x.full.tracks) && x.full.tracks.some((t) => (t.takes || []).length));
  await showMessage(`読み込みました。\n追加 ${added}曲 / 更新 ${updated}曲 / 手元の方が新しいので据え置き ${kept}曲${recAdded ? `\n録音 ${recAdded}本を取り込みました` : ''}${noAudio ? '\n\nこのバックアップには録音の音声が入っていません。録音を鳴らすには、録音した端末で「バックアップ書き出し」→「録音も入れる」で書き出し直してください。' : ''}`);
  route();
}

/* ---------- 起動 ---------- */
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', () => { flushSave(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
  refreshMics();
  navigator.mediaDevices.addEventListener && navigator.mediaDevices.addEventListener('devicechange', () => { refreshMics().then(() => { if (fullView) renderFull(); }); }); // イヤホンを抜き差ししたとき
}
(async function start() {
  try {
    db = await openDB();
    songs = (await dbAll()).map(normalizeSong);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    console.error(e);
    storageOk = false;
  }
  await route();
  if (!lsGet(LS_TUTORIAL)) openTutorial(0);
})();
</script>
